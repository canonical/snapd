summary: End-to-end test for FDE PIN and passphrase support on hybrid systems

details: |
  This test installs an encrypted hybrid Ubuntu system using muinstaller
  which is then protected by PIN and passphrase authentication after
  first boot. Multiple transitions between the available authentication
  modes are exercised (PIN <-> Passphrase <-> None).

systems:
  - ubuntu-24*
  - ubuntu-26*

environment:
  NESTED_ENABLE_TPM: true
  NESTED_ENABLE_SECURE_BOOT: true
  NESTED_BUILD_SNAPD_FROM_CURRENT: true
  NESTED_REPACK_KERNEL_SNAP: true
  NESTED_KEEP_FIRMWARE_STATE: true

  AUTH_MODE/no_auth: none
  AUTH_MODE/passphrase: passphrase
  AUTH_MODE/pin: pin

  # Store related setup.
  STORE_ADDR: localhost:11028
  STORE_DIR: $(pwd)/fake-store-blobdir

skip:
    - reason: This test needs test keys to be trusted
      if: |
        [ "$TRUST_TEST_KEYS" = "false" ]

prepare: |
  # shellcheck source=tests/lib/prepare.sh
  . "$TESTSLIB/prepare.sh"
  #shellcheck source=tests/lib/nested.sh
  . "$TESTSLIB"/nested.sh

  # Build a small helper that reads the TPM dictionary-attack lockout counter
  # directly from the hardware. It is used to cross-check the change-auth rate
  # limiter against the real TPM counter.
  go build ./getdalockout.go

  # Fakestore is needed for "snap prepare-image".
  "$TESTSTOOLS"/store-state setup-fake-store "$STORE_DIR"

  # Expose the needed assertions through the fakestore.
  cp "$TESTSLIB"/assertions/developer1.account "$STORE_DIR/asserts"
  cp "$TESTSLIB"/assertions/developer1.account-key "$STORE_DIR/asserts"
  cp "$TESTSLIB"/assertions/testrootorg-store.account-key "$STORE_DIR/asserts"
  export SNAPPY_FORCE_SAS_URL=http://$STORE_ADDR

  version="$(nested_get_version)"

  # Retrieve the gadget
  snap download --basename=pc --channel="$version/edge" pc

  # Retrieve kernel
  snap download --basename=pc-kernel-from-store --channel="$version/${KERNEL_CHANNEL}" pc-kernel
  # the fakestore needs this assertion
  snap ack pc-kernel-from-store.assert
  # Build kernel with initramfs with the compiled snap-bootstrap
  uc24_build_initramfs_kernel_snap "$PWD/pc-kernel-from-store.snap" "$NESTED_ASSETS_DIR"
  mv "${NESTED_ASSETS_DIR}"/pc-kernel_*.snap pc-kernel-repacked.snap

  gendeveloper1 sign-model < "$TESTSLIB"/assertions/developer1-"$version"-classic-dangerous.json > classic.model

  install_auth_args=()
  case "$AUTH_MODE" in
    none)
      ;;
    passphrase)
      install_auth_args+=(--passphrase "install-time-passphrase")
      ;;
    pin)
      install_auth_args+=(--pin "11042026")
      ;;
    *)
      echo "unknown AUTH_MODE: $AUTH_MODE"
      exit 1
      ;;
  esac

  # setup_nested_hybrid_system.sh runs the muinstaller to install a hybrid system.
  setup_nested_args=(
    --model classic.model
    --store-dir "${STORE_DIR}"
    --gadget pc.snap
    --gadget-assertion pc.assert
    --kernel pc-kernel-repacked.snap
    --kernel-assertion pc-kernel-from-store.assert
    --recovery-key-out "$(pwd)"/recovery-key
    --keyboard-config "us,pc105,dvorak,terminate:ctrl_alt_bksp"
  )
  setup_nested_args+=("${install_auth_args[@]}")
  "${TESTSTOOLS}"/setup_nested_hybrid_system.sh "${setup_nested_args[@]}"

restore: |
  # Best-effort cleanup in case a faked boot id was left mounted in snapd's
  # mount namespace by check_change_auth_counter_sync.
  remote.exec "sudo nsenter -t \$(pgrep -x snapd | head -1) -m -- umount /proc/sys/kernel/random/boot_id 2>/dev/null || true" || true

  "$TESTSTOOLS"/store-state teardown-fake-store "$STORE_DIR"
  rm -rf pc-kernel.* pc.* initrd* linux* kernel* tmp* pc-gadget getdalockout

debug: |
  if [ -f containers.out ]; then
    echo "Last system-volumes value (containers.out)"
    cat containers.out
  fi

  echo "Current system-volumes"
  remote.exec sudo snap debug api /v2/system-volumes

execute: |
  # The APIs tested here shouldn't be available on anything before 26.04
  if os.query is-ubuntu-lt 26.04; then
    remote.exec sudo snap debug api /v2/system-volumes | gojq .result.message | MATCH "this action is not supported on this system"
    exit 0
  fi

  # Check encryption
  remote.exec sudo snap debug api /v2/system-volumes > containers.out

  expected_auth_mode="$AUTH_MODE"

  # system-boot is not encrypted
  gojq '.result."by-container-role"."system-boot"' < containers.out > container.out
  gojq '.encrypted' < container.out | MATCH "^false$"
  gojq '.keyslots | length' < container.out | MATCH "^0$"

  # system-seed is also not encrypted
  gojq '.result."by-container-role"."system-seed"' < containers.out > container.out
  gojq '.encrypted' < container.out | MATCH "^false$"
  gojq '.keyslots | length' < container.out | MATCH "^0$"

  # system-data is encrypted and protected by specified auth mode
  gojq '.result."by-container-role"."system-data"' < containers.out > container.out
  gojq '.encrypted' < container.out | MATCH "^true$"
  gojq '.keyslots | length' < container.out | MATCH "^3$"
  gojq --raw-output '.keyslots.default."auth-mode"' < container.out | MATCH "^${expected_auth_mode}$"
  gojq --raw-output '.keyslots."default-fallback"."auth-mode"' < container.out | MATCH "^${expected_auth_mode}$"
  gojq --raw-output '.keyslots."default-recovery".type' < container.out | MATCH "^recovery$"

  # system-save is also encrypted and protected by specified auth mode
  gojq '.result."by-container-role"."system-save"' < containers.out > container.out
  gojq '.encrypted' < container.out | MATCH "^true$"
  gojq '.keyslots | length' < container.out | MATCH "^3$"
  gojq --raw-output '.keyslots.default."auth-mode"' < container.out | MATCH "^none$"
  gojq --raw-output '.keyslots."default-fallback"."auth-mode"' < container.out | MATCH "^${expected_auth_mode}$"
  gojq --raw-output '.keyslots."default-recovery".type' < container.out | MATCH "^recovery$"

  # shellcheck source=tests/lib/prepare.sh
  . "$TESTSLIB/prepare.sh"
  #shellcheck source=tests/lib/nested.sh
  . "$TESTSLIB"/nested.sh

  remote_action_request()
  {
    local json_req="$1"
    echo "echo '$json_req' | sudo snap debug api -H \"Content-Type: application/json\" -X POST /v2/system-volumes" > action_request
    remote.exec "$(cat action_request)" > resp
  }

  reboot_with_passphrase()
  {
    tests.nested vm set-passphrase "$1"
    tests.nested vm stop
    tests.nested vm start
  }

  # Push the TPM lockout-counter helper onto the system under test. It survives
  # subsequent reboots as it lives in the remote home directory.
  remote.push ./getdalockout

  # Read the real TPM DA lockout counter value.
  hw_counter()
  {
    remote.exec sudo ./getdalockout | sed -n 's/^lockout counter value: //p'
  }

  # Temporarily make snapd observe a different boot id. This is done by
  # bind-mounting a file holding a fake UUID over /proc/sys/kernel/random/boot_id
  # inside snapd's mount namespace, so only snapd is affected. It tricks the
  # DA-lockout rate limiter into believing the system rebooted, forcing it to
  # re-sync its token bucket with the real TPM counter without an actual reboot
  # (a reboot would reset the TPM counter and defeat the purpose).
  mock_boot_id()
  {
    local fake="$1"
    remote.exec "echo '$fake' | sudo tee /run/fake-boot-id >/dev/null"
    remote.exec "sudo nsenter -t \$(pgrep -x snapd | head -1) -m -- mount --bind /run/fake-boot-id /proc/sys/kernel/random/boot_id"
  }

  unmock_boot_id()
  {
    remote.exec "sudo nsenter -t \$(pgrep -x snapd | head -1) -m -- umount /proc/sys/kernel/random/boot_id 2>/dev/null || true"
  }

  # Force the change-auth rate limiter to re-synchronize its token bucket with a
  # *non-zero* real TPM DA lockout counter, exercising the code path that reads
  # the hardware counter, then verify that requests are throttled once the
  # bucket is drained.
  #
  # A reboot cannot be used to trigger the re-sync because ensureFDE resets the
  # TPM counter on boot; instead the boot id observed by snapd is temporarily
  # faked so that the re-sync fires while the counter is still non-zero.
  #
  # $1: auth type (passphrase or pin)
  # $2: current (correct) credential value
  check_change_auth_counter_sync()
  {
    local auth_type="$1"
    local cur="$2"
    local action field new_fmt wrong

    case "$auth_type" in
      passphrase)
        action="change-passphrase"
        field="passphrase"
        new_fmt="ratelimit-%d"
        wrong="wrong-old-passphrase"
        ;;
      pin)
        action="change-pin"
        field="pin"
        new_fmt="%07d"
        wrong="9999999"
        ;;
      *)
        echo "unknown auth type: $auth_type"
        exit 1
        ;;
    esac

    # Wait for the post-reboot TPM DA lockout counter reset to complete. It is
    # done asynchronously in secboot.MarkSuccessful, so there is a race with an
    # early read here.
    retry -n 10 --wait 2 sh -c 'remote.exec sudo ./getdalockout | MATCH "lockout counter value: 0"'

    # (A) A handful of *successful* change-auth requests using the correct
    # credential. These consume rate-limit tokens but do not touch the TPM DA
    # counter, pushing snapd's bucket below (max - counter) so that the later
    # forced re-sync produces an observable upward jump.
    local i new
    for i in 1 2 3 4 5; do
      # shellcheck disable=SC2059
      new="$(printf "$new_fmt" "$i")"
      remote_action_request "{\"action\": \"$action\", \"old-$field\": \"$cur\", \"new-$field\": \"$new\"}"
      change_id="$(gojq --raw-output .change < resp)"
      remote.exec sudo snap watch "$change_id"
      cur="$new"
    done

    # (B) A few change-auth requests with a *wrong* old credential. Each is
    # admitted (consuming a token) but fails inside the TPM, incrementing the
    # real DA lockout counter by one per request.
    for i in 1 2 3; do
      # shellcheck disable=SC2059
      new="$(printf "$new_fmt" "$((100 + i))")"
      remote_action_request "{\"action\": \"$action\", \"old-$field\": \"$wrong\", \"new-$field\": \"$new\"}"
      change_id="$(gojq --raw-output .change < resp)"
      # The change is expected to fail (wrong credential); wait for it either way.
      remote.exec sudo snap watch "$change_id" || true
    done

    # Read the real TPM counter and the token bucket just before forcing a sync.
    local hw_pre tokens_pre
    hw_pre="$(hw_counter)"
    test "$hw_pre" -ge 1
    tokens_pre="$(remote.exec "sudo cat /var/lib/snapd/state.json" | gojq -r '.data.fde."da-lockout-rate-limit".tokens')"

    # (C) Fake the boot id observed by snapd and issue one more request. The
    # rate limiter observes a "new boot" and re-syncs its bucket from the real
    # TPM counter (tokens = max - counter) before consuming a token for this
    # request. The re-sync happens synchronously while the request is admitted,
    # so the fake boot id can be dropped immediately afterwards.
    local real_boot_id fake_boot_id
    real_boot_id="$(remote.exec cat /proc/sys/kernel/random/boot_id)"
    fake_boot_id="$(remote.exec cat /proc/sys/kernel/random/uuid)"
    test "$fake_boot_id" != "$real_boot_id"

    # shellcheck disable=SC2059
    new="$(printf "$new_fmt" "200")"
    mock_boot_id "$fake_boot_id"
    remote_action_request "{\"action\": \"$action\", \"old-$field\": \"$wrong\", \"new-$field\": \"$new\"}"
    unmock_boot_id
    change_id="$(gojq --raw-output .change < resp)"
    remote.exec sudo snap watch "$change_id" || true

    # The bucket was re-synced from the real counter (tokens = max - counter),
    # then had one token consumed for the probe request.
    local tokens_post hw_post
    tokens_post="$(remote.exec "sudo cat /var/lib/snapd/state.json" | gojq -r '.data.fde."da-lockout-rate-limit".tokens')"
    test "$tokens_post" = "$((16 - hw_pre - 1))"

    # The re-sync recorded the faked boot id, proving the boot-id-triggered
    # re-sync path actually ran.
    remote.exec "sudo cat /var/lib/snapd/state.json" | gojq -r '.data.fde."da-lockout-rate-limit"."last-boot-id"' | MATCH "^${fake_boot_id}$"

    # The re-sync produced an observable upward jump in the bucket, ruling out a
    # plain token consumption without a re-sync.
    test "$tokens_post" -gt "$tokens_pre"

    # Cross-check that the probe itself bumped the real TPM counter by one.
    hw_post="$(hw_counter)"
    test "$hw_post" = "$((hw_pre + 1))"

    # (D) Drain the remaining tokens with the correct credential, then confirm
    # the next request is throttled with HTTP 429. The first request here
    # re-syncs the bucket once more (the faked boot id is still recorded as the
    # last observed one) from the real TPM counter, which restores it to exactly
    # tokens_post (max 16 minus the counter). So exactly tokens_post requests are
    # accepted and request number tokens_post + 1 must be throttled.
    local drain
    for drain in $(seq 1 "$tokens_post"); do
      # shellcheck disable=SC2059
      new="$(printf "$new_fmt" "$((300 + drain))")"
      remote_action_request "{\"action\": \"$action\", \"old-$field\": \"$cur\", \"new-$field\": \"$new\"}"
      test "$(gojq -r '."status-code"' < resp)" != "429"
      change_id="$(gojq --raw-output .change < resp)"
      remote.exec sudo snap watch "$change_id"
      cur="$new"
    done

    # The bucket is now empty, so the next request must be throttled.
    # shellcheck disable=SC2059
    new="$(printf "$new_fmt" "999")"
    remote_action_request "{\"action\": \"$action\", \"old-$field\": \"$cur\", \"new-$field\": \"$new\"}"
    test "$(gojq -r '."status-code"' < resp)" = "429"
    MATCH '"status": "Too Many Requests"' < resp
    gojq -r '.result.kind' < resp | MATCH "^fde-change-auth-throttled$"
    gojq -r '.change' < resp | MATCH "^null$"

    # The bucket must now be empty.
    remote.exec "sudo cat /var/lib/snapd/state.json" | gojq -r '.data.fde."da-lockout-rate-limit".tokens' | MATCH "^0$"

    # Rebooting the system re-runs ensureFDE, which resets the TPM DA lockout
    # counter. The token bucket is refilled lazily: the first change-auth after
    # reboot re-syncs it with the reset counter, so the request is accepted
    # again and the bucket ends up at the maximum minus this one request.
    reboot_with_passphrase "$cur"

    remote_action_request "{\"action\": \"$action\", \"old-$field\": \"$cur\", \"new-$field\": \"$new\"}"
    test "$(gojq -r '."status-code"' < resp)" != "429"
    change_id="$(gojq --raw-output .change < resp)"
    remote.exec sudo snap watch "$change_id"
    remote.exec "sudo cat /var/lib/snapd/state.json" | gojq -r '.data.fde."da-lockout-rate-limit".tokens' | MATCH "^15$"
  }

  # Test setting a passphrase after first boot
  # TODO:FDEM: Try all passphrase kdf types (pbkdf2, argon2i, argon2id)
  remote_action_request '{"action": "replace-platform-key", "auth-mode": "passphrase", "passphrase": "ubuntu-1"}'
  change_id="$(gojq --raw-output .change < resp)"
  remote.exec sudo snap watch "$change_id"

  reboot_with_passphrase "ubuntu-1"

  # Check keyslots
  remote.exec sudo snap debug api /v2/system-volumes > containers.out

  # system-data is encrypted and protected by a passphrase
  gojq '.result."by-container-role"."system-data"' < containers.out > container.out
  gojq '.encrypted' < container.out | MATCH "^true$"
  gojq '.keyslots | length' < container.out | MATCH "^3$"
  gojq --raw-output '.keyslots.default."auth-mode"' < container.out | MATCH "^passphrase$"
  gojq --raw-output '.keyslots."default-fallback"."auth-mode"' < container.out | MATCH "^passphrase$"
  gojq --raw-output '.keyslots."default-recovery".type' < container.out | MATCH "^recovery$"

  # system-save is also encrypted and protected by a passphrase
  gojq '.result."by-container-role"."system-save"' < containers.out > container.out
  gojq '.encrypted' < container.out | MATCH "^true$"
  gojq '.keyslots | length' < container.out | MATCH "^3$"
  gojq --raw-output '.keyslots.default."auth-mode"' < container.out | MATCH "^none$"
  gojq --raw-output '.keyslots."default-fallback"."auth-mode"' < container.out | MATCH "^passphrase$"
  gojq --raw-output '.keyslots."default-recovery".type' < container.out | MATCH "^recovery$"

  # Test changing passphrases
  remote_action_request '{"action": "change-passphrase", "old-passphrase": "ubuntu-1", "new-passphrase": "ubuntu-2"}'
  change_id="$(gojq --raw-output .change < resp)"
  remote.exec sudo snap watch "$change_id"

  reboot_with_passphrase "ubuntu-2"

  # Verify the rate limiter re-syncs from a non-zero real TPM DA counter and
  # then throttles once the token bucket is drained.
  check_change_auth_counter_sync "passphrase" "ubuntu-2"

  # Let's reset the passphrase as root (without providing old passphrase)
  remote_action_request '{"action": "replace-platform-key", "auth-mode": "passphrase", "passphrase": "ubuntu-3"}'
  change_id="$(gojq --raw-output .change < resp)"
  remote.exec sudo snap watch "$change_id"

  reboot_with_passphrase "ubuntu-3"

  # Let's switch to PINs as root
  remote_action_request '{"action": "replace-platform-key", "auth-mode": "pin", "pin": "1234"}'
  change_id="$(gojq --raw-output .change < resp)"
  remote.exec sudo snap watch "$change_id"

  reboot_with_passphrase "1234"

  # Test changing PINs
  remote_action_request '{"action": "change-pin", "old-pin": "1234", "new-pin": "4321"}'
  change_id="$(gojq --raw-output .change < resp)"
  remote.exec sudo snap watch "$change_id"

  reboot_with_passphrase "4321"

  # Verify the rate limiter re-syncs from a non-zero real TPM DA counter and
  # then throttles once the token bucket is drained.
  check_change_auth_counter_sync "pin" "4321"

  # Let's remove auth protection completely
  remote_action_request '{"action": "replace-platform-key", "auth-mode": "none"}'
  change_id="$(gojq --raw-output .change < resp)"
  remote.exec sudo snap watch "$change_id"

  reboot_with_passphrase ""

  # And bring it back (similar to first boot experience but now for PINs)
  remote_action_request '{"action": "replace-platform-key", "auth-mode": "pin", "pin": "6789"}'
  change_id="$(gojq --raw-output .change < resp)"
  remote.exec sudo snap watch "$change_id"

  reboot_with_passphrase "6789"

  # refresh rebooting snap
  # $1: path to snap file
  # $2: snap name
  refresh_rebooting_snap()
  {
      local snap_filename=$1
      local snap_name=$2

      boot_id=$(tests.nested boot-id)

      printf "Test installing snap from file %s\n" "$snap_filename"
      remote.push "$snap_filename"
      # install will exit when waiting for the reboot
      remote.exec sudo snap install --dangerous "$snap_filename" | MATCH "Task set to wait until a system restart allows to continue"

      # Check that a reboot notification was setup.
      remote.exec test -f /run/reboot-required
      remote.exec cat /run/reboot-required.pkgs | MATCH "snap:${snap_name}"

      remote.exec sudo reboot || true
      remote.wait-for reboot --wait 1 -n 100 "$boot_id"
      remote.exec sudo snap watch --last=install
  }
  # Ensure update-notifier-common is installed so that reboot notification works.
  remote.exec "sudo apt install -y update-notifier-common"

  # Save PCR profile
  remote.exec "sudo cat /var/lib/snapd/state.json" | gojq -r '.data.fde."keyslot-roles".run.params.all."tpm2-pcr-profile"'  > pcr_profile

  # Test gadget refresh causing reseal.

  # Changing cmdline should force a reseal.
  unsquashfs -d pc-gadget pc.snap
  echo 'console=ttyS0 systemd.journald.forward_to_console=1 loglevel=4' > pc-gadget/cmdline.extra
  KEY_NAME=$(tests.nested download snakeoil-key)
  SNAKEOIL_KEY="$PWD/$KEY_NAME.key"
  SNAKEOIL_CERT="$PWD/$KEY_NAME.pem"
  tests.nested secboot-sign gadget pc-gadget "$SNAKEOIL_KEY" "$SNAKEOIL_CERT"
  snap pack --filename=pc-new.snap pc-gadget/
  refresh_rebooting_snap pc-new.snap pc

  # We expect a reseal, PCR profile should have been updated.
  remote.exec "sudo cat /var/lib/snapd/state.json" | gojq -r '.data.fde."keyslot-roles".run.params.all."tpm2-pcr-profile"'  > pcr_profile_current
  not diff pcr_profile pcr_profile_current
  mv pcr_profile_current pcr_profile

  # Test kernel refresh causing reseal.

  # Resigning kernel should be enough to trigger a reseal.
  uc24_build_initramfs_kernel_snap "$PWD/pc-kernel-repacked.snap" "$PWD/pc-kernel-new.snap"
  refresh_rebooting_snap pc-kernel-new.snap pc

  # We expect a reseal, PCR profile should have been updated.
  remote.exec "sudo cat /var/lib/snapd/state.json" | gojq -r '.data.fde."keyslot-roles".run.params.all."tpm2-pcr-profile"'  > pcr_profile_current
  not diff pcr_profile pcr_profile_current
  mv pcr_profile_current pcr_profile

  # Check encryption again for good measure
  remote.exec sudo snap debug api /v2/system-volumes > containers.out

  # system-data is encrypted and protected by a PIN
  gojq '.result."by-container-role"."system-data"' < containers.out > container.out
  gojq '.encrypted' < container.out | MATCH "^true$"
  gojq '.keyslots | length' < container.out | MATCH "^3$"
  gojq --raw-output '.keyslots.default."auth-mode"' < container.out | MATCH "^pin$"
  gojq --raw-output '.keyslots."default-fallback"."auth-mode"' < container.out | MATCH "^pin$"
  gojq --raw-output '.keyslots."default-recovery".type' < container.out | MATCH "^recovery$"

  # system-save is also encrypted and protected by a PIN
  gojq '.result."by-container-role"."system-save"' < containers.out > container.out
  gojq '.encrypted' < container.out | MATCH "^true$"
  gojq '.keyslots | length' < container.out | MATCH "^3$"
  gojq --raw-output '.keyslots.default."auth-mode"' < container.out | MATCH "^none$"
  gojq --raw-output '.keyslots."default-fallback"."auth-mode"' < container.out | MATCH "^pin$"
  gojq --raw-output '.keyslots."default-recovery".type' < container.out | MATCH "^recovery$"

  # Let's switch to a passphrase one more time for good measure
  remote_action_request '{"action": "replace-platform-key", "auth-mode": "passphrase", "passphrase": "ubuntu-4"}'
  change_id="$(gojq --raw-output .change < resp)"
  remote.exec sudo snap watch "$change_id"

  reboot_with_passphrase "ubuntu-4"

  # Now let's see if we can remove the passphrase when booted with a recovery key
  reboot_with_passphrase "$(cat recovery-key)"

  remote_action_request '{"action": "replace-platform-key", "auth-mode": "none"}'
  change_id="$(gojq --raw-output .change < resp)"
  remote.exec sudo snap watch "$change_id"

  reboot_with_passphrase ""
