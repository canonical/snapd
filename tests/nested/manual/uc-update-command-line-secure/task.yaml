summary: Update command line from gadget in secure boot

details: |
  Check that Ubuntu Core image boots properly with updated command line
  through gadget in secure boot

systems: [ubuntu-2*]

environment:
  NESTED_ENABLE_SECURE_BOOT: true

prepare: |
  VERSION="$(tests.nested show version)"
  case "${VERSION}" in
    26)
      GADGET_CHANNEL=edge
    ;;
    *)
      GADGET_CHANNEL=stable
    ;;
  esac
  KEY_NAME=$(tests.nested download snakeoil-key)
  SNAKEOIL_KEY="$PWD/$KEY_NAME.key"
  SNAKEOIL_CERT="$PWD/$KEY_NAME.pem"
  gadget_args=(
    --gadget-branch "$VERSION"
    --gadget-channel "$GADGET_CHANNEL"
    --sign-key "$SNAKEOIL_KEY"
    --sign-cert "$SNAKEOIL_CERT"
    --sign-grub
  )
  "$TESTSTOOLS"/repack-gadget "${gadget_args[@]}" \
    --output-snap "$(tests.nested get extra-snaps-path)/pc_1.snap"
  "$TESTSTOOLS"/repack-gadget "${gadget_args[@]}" \
    --output-snap pc_2.snap \
    --append-cmdline-extra some_useless_parameter

  tests.nested build-image core
  tests.nested create-vm core

execute: |
  remote.push pc_2.snap
  boot_id="$(tests.nested boot-id)"
  remote.exec "sudo snap install --dangerous pc_2.snap" || [ "$?" -eq 255 ]
  remote.wait-for reboot "${boot_id}"
  remote.exec "MATCH '.*some_useless_parameter.*' </proc/cmdline"
