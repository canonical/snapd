summary: Verify snap-confine exposes host NVIDIA libraries for compute and full drivers

details: |
    Install the host NVIDIA userspace driver in either compute-only form
    (libnvidia-compute-<N>, which ships libcuda.so.<version> but not
    libnvidia-glcore.so) or full form (libnvidia-gl-<N>, which ships both).

    We check that snap-confine exposes the libraries under /var/lib/snapd/lib/gl.

systems:
    - ubuntu-18.04-64
    - ubuntu-2*-64

environment:
    DRIVER_FLAVOR/compute: compute
    DRIVER_FLAVOR/full: full
    SNAPD_TESTING_NVIDIA_DRIVER_VERSION_FILE: /var/lib/nvidia-version-file

prepare: |
    apt-get update
    # Pick the newest driver version available on this system.
    PACKAGE_VERSION="$(apt-cache pkgnames libnvidia-compute- | grep -v server |
        cut -d"-" -f3 | sort -nr | head -n1)"
    if [ -z "$PACKAGE_VERSION" ]; then
        echo "no libnvidia-compute-<N> package available"
        exit 1
    fi
    case "$DRIVER_FLAVOR" in
        compute)
            PACKAGES=("libnvidia-compute-$PACKAGE_VERSION")
            ;;
        full)
            # For 20.04, libnvidia-gl does not depend on libnvidia-compute,
            # so need to manually install both.
            PACKAGES=("libnvidia-compute-$PACKAGE_VERSION" "libnvidia-gl-$PACKAGE_VERSION")
            ;;
        *)
            echo "unknown DRIVER_FLAVOR: $DRIVER_FLAVOR"
            exit 1
            ;;
    esac

    # The packages are available for all the systems in the test.
    # If installation fails, exit with error.
    if ! apt-get install -y "${PACKAGES[@]}"; then
        echo "cannot install ${PACKAGES[*]}"
        exit 1
    fi

    # Look at libcuda.so.*.* to get the exact version of the driver.
    # It is present for both full and compute-only driver installs.
    DRIVER_VERSION="$(find /usr/lib/x86_64-linux-gnu/ -name 'libcuda.so.*.*' | sed -e 's,.*/libcuda\.so\.,,')"
    test -n "$DRIVER_VERSION"
    echo "$DRIVER_VERSION" >"$SNAPD_TESTING_NVIDIA_DRIVER_VERSION_FILE"

    "$TESTSTOOLS"/snaps-state install-local test-nvidia-exposure

restore: |
    snap remove --purge test-nvidia-exposure 2>/dev/null || true

    # Remove the userspace libraries installed by this test.
    apt-get purge -y 'libnvidia-*' 2>/dev/null || true

debug: |
    dpkg -l 'libnvidia-*' 2>/dev/null || true

execute: |
    case "$DRIVER_FLAVOR" in
        compute)
            # libcuda is present, but the GL libraries shipped by
            # libnvidia-gl-<N> are not.
            test-nvidia-exposure.present 'libcuda.so*'
            test-nvidia-exposure.missing 'libnvidia-glcore.so*' 'libEGL_nvidia.so*'
            ;;
        full)
            # Both libcuda and the GL libraries are present.
            test-nvidia-exposure.present \
              'libcuda.so*' 'libnvidia-glcore.so*' 'libEGL_nvidia.so*' 'libGLX_nvidia.so*'
            ;;
    esac
