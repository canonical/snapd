name: test-nvidia-exposure
version: '1.0'
summary: Check the host NVIDIA libraries exposed by snap-confine
description: |
    Checks, from inside a strictly confined snap, that snap-confine exposed the
    expected host NVIDIA userspace libraries under /var/lib/snapd/lib/gl.
base: core24
architectures:
    - all
confinement: strict
grade: stable

apps:
    missing:
        command: missing
        plugs:
            - opengl
    present:
        command: present
        plugs:
            - opengl

environment:
    LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
