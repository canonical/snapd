summary: Check that enabling prompting requests will activate handler services

details: |
    The test verifies that activation of apparmor prompting feature will
    activate handler services even without a session agent, and that a handler
    startup failure prevents enabling prompting.

systems:
  - ubuntu-2*

skip:
    - reason: Ubuntu 20.04 kernels don't support prompting
      if: os.query is-ubuntu 20.04
    - reason: Ubuntu 22.04 kernel doesn't support prompting
      if: os.query is-ubuntu 22.04 && os.query is-kernel-lt 6.7
    - reason: Ubuntu 22.04 AppArmor parser doesn't support prompting
      if: os.query is-ubuntu 22.04 && not tests.info is-reexec-in-use

prepare: |
    # prerequisite for having a prompts handler service
    snap set system experimental.user-daemons=true
    "$TESTSTOOLS"/snaps-state install-local test-snapd-prompt-handler
    snap connect test-snapd-prompt-handler:snap-interfaces-requests-control
    tests.session -u test prepare

restore: |
    # shellcheck source=tests/lib/user-service-agent.sh
    . "$TESTSLIB/user-service-agent.sh"
    if [ -f handler-drop-in ]; then
        drop_in="$(cat handler-drop-in)"
        rm -f "$drop_in"
        tests.session -u test exec systemctl --user daemon-reload
        rm handler-drop-in
    fi
    user_service_agent_restore test
    snap unset system experimental.user-daemons
    snap remove --purge test-snapd-prompt-handler || true
    tests.session -u test restore

debug: |
    echo "Check kernel version"
    uname -a
    echo "Check kernel notification socket presence"
    if ls /sys/kernel/security/apparmor/.notify ; then
        echo "kernel notification socket exists"
    else
        echo "kernel notification socket does not exist"
    fi
    echo "Check system info"
    snap debug api /v2/system-info

execute: |
    # shellcheck source=tests/lib/user-service-agent.sh
    . "$TESTSLIB/user-service-agent.sh"
    not tests.session -u test exec systemctl --user is-active \
        snap.test-snapd-prompt-handler.prompt-handler.service
    not tests.session -u test exec systemctl --user is-enabled \
        snap.test-snapd-prompt-handler.prompt-handler.service

    echo "Keep the user manager and regular bus available without the session agent"
    user_service_agent_mask test

    echo "Make the handler fail synchronously when started"
    drop_in="/run/user/$(id -u test)/systemd/user/snap.test-snapd-prompt-handler.prompt-handler.service.d/spread-activation-failure.conf"
    test ! -e "$drop_in"
    test ! -L "$drop_in"
    tests.session -u test exec mkdir -p "$(dirname "$drop_in")"
    echo "$drop_in" > handler-drop-in
    cat > "$drop_in" <<'EOF'
    [Service]
    Type=oneshot
    ExecStart=
    ExecStart=/bin/false
    Restart=no
    EOF
    tests.session -u test exec systemctl --user daemon-reload

    echo "Check that the prompting feature cannot be enabled"
    # due to failure starting the handler service
    if ! snap set system experimental.apparmor-prompting=true 2> err.out ; then
        MATCH "unable to start prompting handlers" < err.out
    else
        echo "unexpected success enabling apparmor prompting"
        exit 1
    fi

    user_service_agent_check test

    echo "Restore the working handler while leaving the session agent masked"
    rm "$drop_in"
    rm handler-drop-in
    tests.session -u test exec systemctl --user daemon-reload
    tests.session -u test exec systemctl --user reset-failed \
        snap.test-snapd-prompt-handler.prompt-handler.service

    echo "Check that the prompting feature can be successfully enabled now"
    snap set system experimental.apparmor-prompting=true

    echo "And handler services have been started"
    tests.session -u test exec systemctl --user is-active \
        snap.test-snapd-prompt-handler.prompt-handler.service
    tests.session -u test exec systemctl --user is-enabled \
        snap.test-snapd-prompt-handler.prompt-handler.service
    user_service_agent_check test
