summary: device cgroup v2 access map is not emptied when an app is relaunched

details: |
    The device access map of an application is shared by all of its running
    processes. Launching the application again must not make the map
    transiently empty, as that denies running processes access to devices like
    /dev/null (LP: #2170603). Entries that are no longer allowed must still be
    removed from the map.

# skip all systems that do not use unified cgroup hierarchy by default
systems:
  - -amazon-*
  - -opensuse-15*
  - -ubuntu-14.04-*
  - -ubuntu-16.04-*
  - -ubuntu-18.04-*
  - -ubuntu-20.04-*
  - -ubuntu-core-*
  - -centos-9-*

prepare: |
    # snaps using core24 base always get a device cgroup
    "$TESTSTOOLS"/snaps-state install-local test-snapd-sh-core24

restore: |
    touch /var/snap/test-snapd-sh-core24/common/stop
    snap remove --purge test-snapd-sh-core24 || true
    rm -f /sys/fs/bpf/snap/snap_test-snapd-sh-core24_sh

execute: |
    map=/sys/fs/bpf/snap/snap_test-snapd-sh-core24_sh

    echo "Launch the app so that snap-confine creates the device access map"
    snap run test-snapd-sh-core24.sh -c '/bin/true'
    test -e "$map"
    # /dev/null (c 1:3) must be present in the map
    tests.device-cgroup test-snapd-sh-core24.sh dump | MATCH 'c 1:3 rwm'

    echo "Add an entry that is not allowed by the current configuration"
    # key for c 99:99, which is not assigned to the snap
    tests.device-cgroup test-snapd-sh-core24.sh allow c 99:99
    tests.device-cgroup test-snapd-sh-core24.sh dump | MATCH 'c 99:99 rwm'

    echo "Relaunch the app and verify the stale entry is removed"
    snap run test-snapd-sh-core24.sh -c '/bin/true'
    tests.device-cgroup test-snapd-sh-core24.sh dump | NOMATCH 'c 99:99 rwm'
    tests.device-cgroup test-snapd-sh-core24.sh dump | MATCH 'c 1:3 rwm'

    echo "Keep a process using /dev/null running while the app is relaunched"
    rm -f /var/snap/test-snapd-sh-core24/common/stop /var/snap/test-snapd-sh-core24/common/failed
    # shellcheck disable=SC2016
    snap run test-snapd-sh-core24.sh -c '
        while [ ! -e "$SNAP_COMMON/stop" ]; do
            echo > /dev/null || touch "$SNAP_COMMON/failed"
        done' &
    writer=$!

    seq 1 100 | xargs -P 10 -I{} snap run test-snapd-sh-core24.sh -c '/bin/true'

    touch /var/snap/test-snapd-sh-core24/common/stop
    wait "$writer"

    echo "Verify that access to /dev/null was never denied"
    test ! -e /var/snap/test-snapd-sh-core24/common/failed
