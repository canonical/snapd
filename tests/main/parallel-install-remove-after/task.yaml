summary: Checks for parallel installation interfering with non-parallel snaps

details: |
  Make sure parallel instances do not interfere with other snaps. In particular,
  parallel instances create a recursive bind mount of $SNAP_MOUNT_DIR. This
  should not prevent snaps from being unmounted when removed.

environment:
    CONFINEMENT/strict: strict
    CONFINEMENT/classic: classic

skip:
    - reason: classic snaps are not supported on Ubuntu Core
      if: '[ "$CONFINEMENT" = classic ] && os.query is-core'
    - reason: classic parallel installs require the var-snap and
        snap-mount-dir mount units shipped by the native package
      if: '[ "$CONFINEMENT" = classic ] && not systemctl cat var-snap.mount'

prepare: |
    SNAP_MOUNT_DIR="$(os.paths snap-mount-dir)"
    if [ "$CONFINEMENT" = classic ] && [ "$SNAP_MOUNT_DIR" = "/var/lib/snapd/snap" ] && [ ! -L /snap ]; then
        # set up classic execution support
        ln -sfn "$SNAP_MOUNT_DIR" /snap
        tests.cleanup defer rm -f /snap
    fi

    if [ "$CONFINEMENT" = classic ]; then
        # Fedora/openSUSE/Arch/Debian make var-snap.mount opt-in; Ubuntu enables it.
        # Classic parallel installs need both mount points active.
        if [ "$SNAP_MOUNT_DIR" = "/snap" ]; then
            SNAP_MOUNT_UNIT="snap.mount"
        else
            SNAP_MOUNT_UNIT="var-lib-snapd-snap.mount"
        fi
        for u in "$SNAP_MOUNT_UNIT" var-snap.mount; do
            printf '%s %s %s\n' "$u" "$(systemctl is-enabled "$u" || true)" "$(systemctl is-active "$u" || true)"
        done > mount-units.state
        systemctl enable --now var-snap.mount
        systemctl start "$SNAP_MOUNT_UNIT"
    fi

restore: |
    if [ "$CONFINEMENT" = classic ] && [ -f mount-units.state ]; then
        # Remove test snaps before stopping a parent mount.
        for snap_name in test-snapd-sh_foo test-snapd-sh test-snapd-classic-confinement_foo test-snapd-classic-confinement; do
            if snap list "$snap_name" >/dev/null 2>&1; then
                snap remove --purge "$snap_name"
            fi
        done
        while read -r u enabled active; do
            if [ "$active" != active ]; then
                systemctl stop "$u"
            fi
            case "$enabled" in
                enabled) systemctl enable "$u" ;;
                disabled) systemctl disable "$u" ;;
                static) : ;;
                *) echo "unexpected initial state for $u: $enabled" >&2; exit 1 ;;
            esac
            if [ "$active" = active ]; then
                systemctl start "$u"
            fi
        done < mount-units.state
    fi

execute: |
    # install confined and classic snaps
    "$TESTSTOOLS"/snaps-state install-local test-snapd-sh
    if [ "$CONFINEMENT" = classic ]; then
        "$TESTSTOOLS"/snaps-state install-local test-snapd-classic-confinement --classic
    fi

    # regular instances work
    # shellcheck disable=SC2016
    test-snapd-sh.sh -c 'echo confined $SNAP_INSTANCE_NAME works'
    if [ "$CONFINEMENT" = classic ]; then
        # shellcheck disable=SC2016
        test-snapd-classic-confinement.sh -c 'echo classic $SNAP_INSTANCE_NAME works'
    fi

    # new instances of same snaps
    "$TESTSTOOLS"/snaps-state install-local-as test-snapd-sh test-snapd-sh_foo
    if [ "$CONFINEMENT" = classic ]; then
        "$TESTSTOOLS"/snaps-state install-local-as test-snapd-classic-confinement test-snapd-classic-confinement_foo --classic
    fi

    # parallel instances works
    # shellcheck disable=SC2016
    test-snapd-sh_foo.sh -c 'echo confined $SNAP_INSTANCE_NAME works'
    if [ "$CONFINEMENT" = classic ]; then
        # shellcheck disable=SC2016
        test-snapd-classic-confinement_foo.sh -c 'echo classic $SNAP_INSTANCE_NAME works'
    fi

    # removal of snaps should not fail
    snap remove --purge test-snapd-sh
    if [ "$CONFINEMENT" = classic ]; then
        snap remove --purge test-snapd-classic-confinement
    fi

    # neither should the removal of instances
    snap remove --purge test-snapd-sh_foo
    if [ "$CONFINEMENT" = classic ]; then
        snap remove --purge test-snapd-classic-confinement_foo
    fi
