summary: Check that parallel install is blocked for snaps with unsupported app settings

details: |
    Apps that set common-id or bus-name cannot be installed as parallel
    instances, since these identifiers must be unique on the system. A regular
    (non-instanced) install of the same snap must still succeed.

prepare: |
    snap set system experimental.parallel-instances=true
    tests.cleanup defer snap unset system experimental.parallel-instances

execute: |
    check_parallel_install_rejected() {
        local setting="$1"
        local value="$2"
        local snap_name="test-snapd-pi-${setting}"
        local snapdir
        snapdir=$(mktemp -d)
        chmod 755 "$snapdir"
        tests.cleanup defer rm -rf "$snapdir"
        mkdir -p "$snapdir/meta" "$snapdir/bin"
        printf '#!/bin/sh\n' > "$snapdir/bin/cmd"
        chmod +x "$snapdir/bin/cmd"
        {
            printf 'name: %s\n' "$snap_name"
            printf 'version: "1.0"\n'
            printf 'apps:\n  cmd:\n    command: bin/cmd\n    %s: %s\n' "$setting" "$value"
        } > "$snapdir/meta/snap.yaml"
        snap pack --filename="/tmp/${snap_name}.snap" "$snapdir" >/dev/null
        tests.cleanup defer rm -f "/tmp/${snap_name}.snap"

        echo "Installing $snap_name as a parallel instance is rejected"
        if snap install --dangerous --name "${snap_name}_foo" "/tmp/${snap_name}.snap" 2>install.err; then
            echo "parallel install should have been rejected"
            exit 1
        fi
        tr '\n' ' ' < install.err | tr -s ' ' | MATCH "app \"cmd\" uses ${setting} which is not supported for parallel instances"

        echo "Regular install of $snap_name still works"
        snap install --dangerous "/tmp/${snap_name}.snap"
        tests.cleanup defer snap remove --purge "$snap_name"
    }

    check_parallel_install_rejected common-id org.example.PiCommonId
    check_parallel_install_rejected bus-name org.example.PiBusName
