summary: Check that parallel install is blocked for interfaces that do not support parallel instances

details: |
    Some interfaces declare that they do not support parallel instances.
    Installing a snap as a parallel instance when it has a plug or slot using
    such an interface must be rejected, while a regular (non-instanced) install
    of the same snap must still succeed.

prepare: |
    snap set system experimental.parallel-instances=true
    tests.cleanup defer snap unset system experimental.parallel-instances

execute: |
    make_test_snap() {
        local snap_name="$1"
        local iface_name="$2"
        local side="$3"  # plug or slot
        shift 3
        # Use nounset-safe expansions for compatibility with older bash
        local -a attrs=("${@+$@}")
        local snapdir
        snapdir=$(mktemp -d)
        chmod 755 "$snapdir"
        tests.cleanup defer rm -rf "$snapdir"
        mkdir -p "$snapdir/meta" "$snapdir/bin"
        printf '#!/bin/sh\n' > "$snapdir/bin/cmd"
        chmod +x "$snapdir/bin/cmd"
        {
            printf 'name: %s\n' "$snap_name"
            printf 'version: "1.0"\n'
            printf 'apps:\n  cmd:\n    command: bin/cmd\n'
            printf '%ss:\n  %s-%s:\n    interface: %s\n' "$side" "$iface_name" "$side" "$iface_name"
            for attr in "${attrs[@]+"${attrs[@]}"}"; do printf '    %s\n' "$attr"; done
        } > "$snapdir/meta/snap.yaml"
        snap pack --filename="/tmp/${snap_name}.snap" "$snapdir" >/dev/null
        tests.cleanup defer rm -f "/tmp/${snap_name}.snap"
        # cleanup now
        rm -rf "$snapdir"
    }

    check_parallel_install_rejected() {
        local iface_name="$1"
        local side="$2"  # plug or slot
        shift 2
        local -a attrs=("${@+$@}")
        local snap_name="reject-${iface_name}-${side}"
        make_test_snap "$snap_name" "$iface_name" "$side" "${attrs[@]+"${attrs[@]}"}"
        echo "Try installing $snap_name without an instance key"
        if snap install --dangerous "/tmp/${snap_name}.snap" 2>install-noinstance.err; then
            tests.cleanup defer snap remove --purge "$snap_name"
            snap list | MATCH "^${snap_name} "
        else
            # A dangerous install still performs minimal slot-side base declaration
            # checks and also ldconfig plugs can only be defined by the system snap.
            local exp_decl_slot_err="installation not allowed by \"${iface_name}-slot\" slot rule of interface \"${iface_name}\""
            local exp_ldconfig_plug_err="ldconfig plugs can be defined only by the system snap"
            tr '\n' ' ' < install-noinstance.err | tr -s ' ' | MATCH "(${exp_decl_slot_err}|${exp_ldconfig_plug_err})"
        fi
        echo "Installing $snap_name as a parallel instance is rejected"
        if snap install --dangerous --name "${snap_name}_foo" "/tmp/${snap_name}.snap" 2>install.err; then
            echo "installation of ${snap_name}_foo was expected to fail"
            snap remove --purge "${snap_name}_foo"
            exit 1
        fi
        # Above mentioned policy checks will also reject this snap, but the parallel-
        # instance interface check must reject it first.
        tr '\n' ' ' < install.err | tr -s ' ' | MATCH "cannot install snap \"${snap_name}_foo\" as parallel instance: ${side} \"${iface_name}-${side}\" with interface \"$iface_name\""
        # cleanup now
        snap remove --purge "$snap_name"
        rm -f "/tmp/${snap_name}.snap"
        echo
    }

    check_parallel_install_plug_rejected() {
        local iface_name="$1"
        shift
        local -a attrs=("${@+$@}")
        check_parallel_install_rejected "$iface_name" plug "${attrs[@]+"${attrs[@]}"}"
    }

    check_parallel_install_slot_rejected() {
        local iface_name="$1"
        shift
        local -a attrs=("${@+$@}")
        check_parallel_install_rejected "$iface_name" slot "${attrs[@]+"${attrs[@]}"}"
    }

    check_parallel_install_plug_and_slot_rejected() {
        local iface_name="$1"
        shift
        local -a attrs=("${@+$@}")
        check_parallel_install_rejected "$iface_name" plug "${attrs[@]+"${attrs[@]}"}"
        check_parallel_install_rejected "$iface_name" slot "${attrs[@]+"${attrs[@]}"}"
    }

    check_parallel_install_allowed() {
        local iface_name="$1"
        local side="$2"  # plug or slot
        shift 2
        local -a attrs=("${@+$@}")
        local snap_name="allow-${iface_name}-${side}"
        make_test_snap "$snap_name" "$iface_name" "$side" "${attrs[@]+"${attrs[@]}"}"
        echo "Installing $snap_name without an instance key"
        snap install --dangerous "/tmp/${snap_name}.snap"
        tests.cleanup defer snap remove --purge "$snap_name"
        snap list | MATCH "^${snap_name} "
        echo "Installing $snap_name as a parallel instance is allowed"
        snap install --dangerous --name "${snap_name}_foo" "/tmp/${snap_name}.snap"
        tests.cleanup defer snap remove --purge "${snap_name}_foo"
        snap list | MATCH "^${snap_name}_foo "
        # cleanup now
        snap remove --purge "${snap_name}_foo" "$snap_name"
        rm -f "/tmp/${snap_name}.snap"
        echo
    }

    check_parallel_install_plug_allowed() {
        local iface_name="$1"
        shift
        local -a attrs=("${@+$@}")
        check_parallel_install_allowed "$iface_name" plug "${attrs[@]+"${attrs[@]}"}"
    }

    ####################################################################
    #            UNSUPPORTED PLUG AND SLOT INTERFACES                  #
    ####################################################################

    check_parallel_install_plug_and_slot_rejected core-support

    if snap debug sandbox-features --required apparmor:parser:mqueue-posix; then
        check_parallel_install_plug_rejected posix-mq

        check_parallel_install_slot_rejected posix-mq \
            "path: /test-mq-slot"
    else
        echo "SKIP: AppArmor does not support POSIX message queues"
    fi

    ####################################################################
    #                   UNSUPPORTED SLOT INTERFACES                    #
    ####################################################################

    # Note: only a representative subset is covered here due to the large
    # number of interfaces, but all are unit tested.

    check_parallel_install_slot_rejected audio-playback
    check_parallel_install_plug_allowed audio-playback

    check_parallel_install_slot_rejected avahi-control
    check_parallel_install_plug_allowed avahi-control

    check_parallel_install_slot_rejected bluez
    check_parallel_install_plug_allowed bluez

    check_parallel_install_slot_rejected fwupd
    check_parallel_install_plug_allowed fwupd

    check_parallel_install_slot_rejected network-manager
    check_parallel_install_plug_allowed network-manager

    check_parallel_install_slot_rejected ubuntu-download-manager
    check_parallel_install_plug_allowed ubuntu-download-manager

    check_parallel_install_slot_rejected vulkan-driver-libs \
        "compatibility: vulkan-1-(2..5)-ubuntu-2404" \
        "icd-source: [\$SNAP/icd]" \
        "library-source: [\$SNAP/lib]"
    # Note: the plug side is not checked here as this interface is
    # restricted to the system snap.

    ####################################################################
    #                   UNSUPPORTED PLUG INTERFACES                    #
    ####################################################################

    # Note: only a representative subset is covered here due to the large
    # number of interfaces, but all are unit tested.

    # Note: the slot side is not checked here as these interfaces are
    # restricted to the system/gadget snaps.

    check_parallel_install_plug_rejected acrn-support

    check_parallel_install_plug_rejected dm-crypt

    check_parallel_install_plug_rejected dsp

    check_parallel_install_plug_rejected openvswitch-support

    check_parallel_install_plug_rejected xilinx-dma
