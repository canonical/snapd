project: snapd-testing-tools

environment:
    PROJECT_PATH: /root/snapd-testing-tools
    PATH: $PROJECT_PATH/tools:$PROJECT_PATH/utils:$PROJECT_PATH/remote:$PATH
    
backends:
    openstack:
        key: '$(HOST: echo "$OS_CREDENTIALS_AMD64_PS7")'
        plan: shared.xsmall
        halt-timeout: 2h
        wait-timeout: 10m
        groups: [default]
        environment: &openstack-env
            SNAPD_USE_PROXY: 'true'
            HTTP_PROXY: 'http://egress.ps7.internal:3128'
            HTTPS_PROXY: 'http://egress.ps7.internal:3128'
            http_proxy: 'http://egress.ps7.internal:3128'
            https_proxy: 'http://egress.ps7.internal:3128'
            no_proxy: '127.0.0.1,127.0.0.53,localhost'
            NO_PROXY: '127.0.0.1,127.0.0.53,localhost'
            NTP_SERVER: 'ntp.ps7.internal'
        systems: &openstack-systems
            - ubuntu-16.04-64:
                image: snapd-spread/ubuntu-16.04-64
            - ubuntu-18.04-64:
                image: snapd-spread/ubuntu-18.04-64
            - ubuntu-20.04-64:
                image: snapd-spread/ubuntu-20.04-64
            - ubuntu-22.04-64:
                image: snapd-spread/ubuntu-22.04-64
            - ubuntu-24.04-64:
                image: snapd-spread/ubuntu-24.04-64
            - ubuntu-26.04-64:
                image: snapd-spread/ubuntu-26.04-64

            - fedora-44-64:
                image: snapd-spread/fedora-44-64
            - opensuse-16.0-64:
                image: snapd-spread/opensuse-16.0-64
            - opensuse-tumbleweed-64:
                image: snapd-spread/opensuse-tumbleweed-64
            - centos-9-64:
                image: snapd-spread/centos-9-64
            - debian-sid-64:
                image: snapd-spread/debian-sid-64

    openstack-ext:
        type: openstack
        key: '$(HOST: echo "$OS_CREDENTIALS_AMD64_PS7")'
        plan: shared.medium
        storage: 30G
        halt-timeout: 2h
        wait-timeout: 10m
        groups: [default]
        environment: *openstack-env
        systems: &openstack-nested-systems
            - ubuntu-16.04-64:
                  image: snapd-spread/ubuntu-16.04-64
                  storage: 20G
                  workers: 4
            - ubuntu-18.04-64:
                  image: snapd-spread/ubuntu-18.04-64
                  storage: 20G
                  workers: 4
            - ubuntu-20.04-64:
                  image: snapd-spread/ubuntu-20.04-64-hwe
                  storage: 20G
                  workers: 12
            - ubuntu-22.04-64:
                  image: snapd-spread/ubuntu-22.04-64
                  storage: 25G
                  workers: 12
            - ubuntu-24.04-64:
                  image: snapd-spread/ubuntu-24.04-64
                  storage: 30G
                  workers: 12
            - ubuntu-26.04-64:
                  image: snapd-spread/ubuntu-26.04-64
                  storage: 30G
                  workers: 12

    openstack-dev:
        type: openstack
        key: '$(HOST: echo "$OS_CREDENTIALS_STG_AMD64_PS7")'
        plan: shared.xsmall
        halt-timeout: 2h
        wait-timeout: 10m
        groups: [default]
        proxy: ingress-haproxy.ps7.canonical.com
        cidr-port-rel: [10.151.54.0/24:4000]
        volume-auto-delete: true
        environment: *openstack-env
        systems: *openstack-systems

    openstack-arm:
        type: openstack
        key: '$(HOST: echo "$OS_CREDENTIALS_ARM64_PS7")'
        plan: shared.xsmall.arm64
        halt-timeout: 2h
        wait-timeout: 10m
        groups: [default]
        environment: *openstack-env
        systems: &openstack-arm-systems
            - ubuntu-20.04-arm-64:
                image: snapd-spread/ubuntu-20.04-arm-64
            - ubuntu-22.04-arm-64:
                image: snapd-spread/ubuntu-22.04-arm-64
            - ubuntu-24.04-arm-64:
                image: snapd-spread/ubuntu-24.04-arm-64
            - ubuntu-26.04-arm-64:
                image: snapd-spread/ubuntu-26.04-arm-64

    openstack-arm-dev:
        type: openstack
        key: '$(HOST: echo "$OS_CREDENTIALS_STG_ARM64_PS7")'
        plan: shared.xsmall.arm64
        halt-timeout: 2h
        wait-timeout: 10m
        groups: [default]
        proxy: ingress-haproxy.ps7.canonical.com
        cidr-port-rel: [10.151.53.0/24:3000]
        volume-auto-delete: true
        environment: *openstack-env
        systems: *openstack-arm-systems


    testflinger:
        wait-timeout: 30m
        kill-timeout: 40m
        systems:
            - ubuntu-core-24-arm-64-rpi4:
                  queue: rpi4b
                  image: https://cdimage.ubuntu.com/ubuntu-core/24/dangerous-stable/current/ubuntu-core-24-arm64+raspi.img.xz
                  username: ubuntu
                  password: ubuntu
            - ubuntu-core-20-murcia:
                queue: murcia-3200
                image: core20-latest-stable
                username: ubuntu
                reserve-key: lp:sergio-j-cazzolato
                ssh-rsa-key: '$(HOST: echo "$SPREAD_SSH_KEY")'
                ssh-key-pass: '$(HOST: echo "$SPREAD_SSH_KEY_PASS")'


path: /root/snapd-testing-tools

kill-timeout: 10m
warn-timeout: 3m

prepare: |
    echo "Prepare snapd-testing-tools project"

restore: |
    echo "Restore snapd-testing-tools project"
    rm -rf "$PROJECT_PATH"

suites:
    tests/:
        summary: Main test suite for snapd-testing-tools project
        prepare: |
            # setup snapd proxy if needed
            if [ "${SNAPD_USE_PROXY:-}" = true ] && [ -n "$(command -v snap)" ]; then
                mkdir -p /etc/systemd/system/snapd.service.d
                PROXY_CONF=/etc/systemd/system/snapd.service.d/proxy.conf
                {
                echo "[Service]"
                echo "Environment=HTTPS_PROXY=$HTTPS_PROXY HTTP_PROXY=$HTTP_PROXY https_proxy=$HTTPS_PROXY http_proxy=$HTTP_PROXY NO_PROXY=$NO_PROXY no_proxy=$NO_PROXY"
                } >> "$PROXY_CONF"

                systemctl daemon-reload
                systemctl restart snapd.service
            fi

            # setup system proxy if needed
            if [ -n "${HTTPS_PROXY:-}" ]; then
                {
                echo "HTTPS_PROXY=$HTTPS_PROXY"
                echo "HTTP_PROXY=$HTTP_PROXY"
                echo "https_proxy=$HTTPS_PROXY"
                echo "http_proxy=$HTTP_PROXY"
                echo "NO_PROXY=$NO_PROXY"
                echo "no_proxy=$NO_PROXY"
                } >> /etc/environment
            fi

            echo "Preparing snapd-testing-tools main suite"
            # Create users for the tests
            useradd -m tools-user-1
            echo tools-user-1:tools-user-1 | sudo chpasswd
            useradd -m tools-user-2
            echo tools-user-2:tools-user-2 | sudo chpasswd
        restore: |
            echo "Restoring snapd-testing-tools main suite"
