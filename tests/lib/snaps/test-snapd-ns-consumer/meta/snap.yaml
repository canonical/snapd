name: test-snapd-ns-consumer
summary: Helper snap for mount namespace tests
version: 1.0
base: core20

apps:
  cmd:
    command: bin/cmd
    plugs: [ shared-content-plug ]

plugs:
  shared-content-plug:
    interface: content
    target: import
    content: mylib
    default-provider: test-snapd-content-slot