name: test-snapd-password-manager-consumer
version: 1.0
summary: Basic password-manager-service consumer
description: Basic snap declaring a plug on the password-manager-service interface.
base: core24
grade: stable
confinement: strict

apps:
  secret-tool:
    command: usr/bin/secret-tool
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET
    plugs:
      - password-manager-service

parts:
  secret-tool:
    plugin: nil
    stage-packages:
      - libsecret-tools