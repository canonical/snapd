summary: Build snapd on a specific architecture

details: |
   Verifies that snapd can be built on a specific architecture.

systems: [ubuntu-*]

kill-timeout: 150m

prepare: |
    # make sure snapd snap is refreshed
    if [ -z "$(command -v snap)" ]; then
        apt update
        apt install -y snapd
    fi
    snap refresh
    snap install --channel="${SNAPCRAFT_SNAP_CHANNEL}" snapcraft --classic

execute: |
    cd "$PROJECT_PATH"
    # An empty http_proxy is visible to craft-archives on the host and makes
    # gpg's keyserver retry fail with "IPC syntax error".
    if [ -z "${http_proxy:-}" ]; then unset http_proxy; fi
    if [ -z "${https_proxy:-}" ]; then unset https_proxy; fi
    if [ -z "${HTTP_PROXY:-}" ]; then unset HTTP_PROXY; fi
    if [ -z "${HTTPS_PROXY:-}" ]; then unset HTTPS_PROXY; fi
    snapcraft --verbose --destructive-mode
    test -f snapd_*.snap
