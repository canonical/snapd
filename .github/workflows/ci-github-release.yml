name: Github release prepare

on:
  push:
    tags:
      # x.y or x.y.z
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

  # for debugging only
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: 0
            fetch-tags: true

      - name: Get the release version from tag push
        if: "${{ env.VERSION == '' && github.event_name == 'push' }}"
        shell: bash
        run: |
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Get the release version from input
        if: "${{ env.VERSION == '' && github.event_name == 'workflow_dispatch' }}"
        shell: bash
        run: |
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV

      - name: Show the version and sanitize
        run: |
            echo "version is: $VERSION"

            if [ -z "$VERSION" ]; then
                echo "VERSION is unset"
                exit 1
            fi

      - name: Checkout tag
        shell: bash
        run: |
            git checkout "$VERSION"

      - name: Check that tag version matches the reference packaging
        shell: bash
        run: |
            set -o pipefail

            if ! head -1 ./packaging/ubuntu-16.04/changelog | grep -q "snapd ($VERSION)" ; then
                 echo "version does not match Ubuntu packaging" >&2
                 exit 1
            fi

            # TODO verify other packaging?

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            gh release create $VERSION --draft --verify-tag --title $VERSION

    outputs:
      version: ${{ env.VERSION }}

  build-release:
    name: build-release
    needs: [create-release]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          fetch-depth: 0
          fetch-tags: true

    - name: Set the release version from create-release job
      shell: bash
      run: |
          echo "VERSION=${{ needs.create-release.outputs.version }}" >> $GITHUB_ENV

    - name: Install the Go snap
      run: |
          sudo snap install --classic --channel=latest/stable go

    - name: Fetch dependencies
      shell: bash
      run: |
          ./get-deps.sh

    - name: Prepare assets
      shell: bash
      run: |
          outdir="$RUNNER_TEMP/out-dir"
          mkdir $outdir
          ./packaging/pack-source -o $outdir -v "$VERSION"
          ./packaging/pack-source -o $outdir -v "$VERSION" -s

    - name: Verify the version is baked into the source tarballs
      shell: bash
      run: |
          set -eu
          cd "$RUNNER_TEMP/out-dir"
          # Each tarball must carry snapdtool/version_generated.go with the
          # release version baked in, so that downstream packaging does not
          # need to run mkversion.sh.
          for f in *.tar*; do
              echo "checking $f"
              if ! tar -tf "$f" | grep -q 'snapdtool/version_generated.go'; then
                  # the only-vendor tarball carries no snapd sources
                  case "$f" in
                      *.only-vendor.tar*) echo "skipping vendor-only tarball"; continue;;
                  esac
                  echo "version_generated.go missing from $f" >&2
                  exit 1
              fi
              baked="$(tar -xf "$f" -O --wildcards '*/snapdtool/version_generated.go' | grep 'UpstreamVersion =' || true)"
              echo "baked version: $baked"
              if ! echo "$baked" | grep -qF "UpstreamVersion = \"$VERSION\""; then
                  echo "expected UpstreamVersion = \"$VERSION\" in $f" >&2
                  exit 1
              fi
          done

    - name: Checksums
      shell: bash
      run: |
          cd "$RUNNER_TEMP/out-dir"
          for f in *.tar*; do
               sha256sum "$f"
          done

    - name: Upload assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
          version="${{ needs.create-release.outputs.version }}"
          cd "$RUNNER_TEMP/out-dir"
          for f in *.tar*; do
              gh release upload --repo "${{ github.repository }}" "$version" "$f"
          done
