name: advisory tracker

# Poll GitHub repository security advisories and track them as children of
# SNAPDENG-37541. repository_advisory is a webhook, not an Actions trigger, so
# this job polls the advisories API.
#
# This workflow runs only in canonical/snapd-security-release. It reads
# advisories from public canonical/snapd. ADVISORY_TRACKER_CREATE and
# ADVISORY_TRACKER_NOTIFY allow ticket creation and Mattermost notices.
# A scheduled run applies when at least one is true. A dispatched sync writes
# only when apply is set, and only the writes those variables allow. dry-run
# wins over apply and does not write.
#
# A summary replaces the tracking table in the parent issue description.
# A summary with dry-run reports that table and does not write it. Sync
# dry-run does not write. Text above the table stays. The same table is
# written to the Actions summary, with the time and a link to this run.
#
# contents: read lets checkout fetch these scripts. The track job also has
# actions: write for the summary artifact. The token is not used to change
# repository contents.
# Advisory reads and summary updates prefer SNAPD_ADVISORY_GITHUB_TOKEN, which
# needs write access to repository security advisories when a codename is
# applied. Jira uses JIRA_EMAIL and JIRA_API_TOKEN through atlassian-python-api.
# GitHub advisory reads use PyGithub. New codenames come from the petname package.

on:
  schedule:
    # Every 2 hours at :00 UTC, including 08:00.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'sync tickets or print a read-only summary'
        type: choice
        options:
          - summary
          - sync
        default: summary
      apply:
        description: 'Perform the writes allowed by the repository variables'
        type: boolean
        default: false
      dry-run:
        description: 'Report intended writes without performing them'
        type: boolean
        default: false
  # Payload fields: action (summary or sync), apply, and dry_run.
  repository_dispatch:
    types: [advisory-tracker]

concurrency:
  group: advisory-tracker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'canonical/snapd-security-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_advisory_tracker.py'

  track:
    needs: test
    if: github.repository == 'canonical/snapd-security-release'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve mode
        id: mode
        env:
          ADVISORY_TRACKER_CREATE: ${{ vars.ADVISORY_TRACKER_CREATE }}
          ADVISORY_TRACKER_NOTIFY: ${{ vars.ADVISORY_TRACKER_NOTIFY }}
          INPUT_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || '' }}
          INPUT_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || '' }}
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] || '' }}
          PAYLOAD_ACTION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.action || '' }}
          PAYLOAD_APPLY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.apply || '' }}
          PAYLOAD_DRY_RUN: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.dry_run || '' }}
        run: |
          set -euo pipefail
          mode="$(python3 .github/scripts/advisory_tracker.py resolve-mode)"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "resolved mode: ${mode}"

      - name: Require Jira credentials
        if: steps.mode.outputs.mode != 'skip'
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          HAS_ADVISORY_TOKEN: ${{ secrets.SNAPD_ADVISORY_GITHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ -z "${JIRA_API_TOKEN}" || -z "${JIRA_EMAIL}" ]]; then
              echo "::error::set JIRA_API_TOKEN and JIRA_EMAIL"
              exit 1
          fi
          if [[ "${HAS_ADVISORY_TOKEN}" == "true" ]]; then
              echo "using SNAPD_ADVISORY_GITHUB_TOKEN"
          else
              echo "using github.token"
          fi

      - name: Skip sync
        if: steps.mode.outputs.mode == 'skip'
        run: |
          set -euo pipefail
          {
              echo "# Advisory tracker"
              echo
              echo "Sync was skipped. A scheduled run skips when \`ADVISORY_TRACKER_CREATE\` and \`ADVISORY_TRACKER_NOTIFY\` are both unset. Set each repository variable to \`true\` to allow that write. Dispatch this workflow with action \`sync\` and \`apply\` set to write what those variables allow. Dispatch \`dry-run\` to report those writes. Dispatch \`summary\` to refresh the tracking table without creating tickets."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install API clients
        if: steps.mode.outputs.mode == 'summary' || steps.mode.outputs.mode == 'summary-dry-run' || steps.mode.outputs.mode == 'dry-run' || steps.mode.outputs.mode == 'apply'
        run: python3 -m pip install --user 'atlassian-python-api==5.0.5' 'PyGithub==2.10.0'

      - name: Install petname
        if: steps.mode.outputs.mode == 'summary' || steps.mode.outputs.mode == 'summary-dry-run' || steps.mode.outputs.mode == 'dry-run' || steps.mode.outputs.mode == 'apply'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y petname

      - name: Summarize advisories
        if: steps.mode.outputs.mode == 'summary' || steps.mode.outputs.mode == 'summary-dry-run'
        env:
          SNAPD_ADVISORY_GITHUB_TOKEN: ${{ secrets.SNAPD_ADVISORY_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_BUG_LINK_FIELD: ${{ vars.JIRA_BUG_LINK_FIELD }}
          MATTERMOST_NEW_ADVISORY_WEBHOOK_URL: ${{ secrets.MATTERMOST_NEW_ADVISORY_WEBHOOK_URL }}
          ADVISORY_TRACKER_CREATE: ${{ vars.ADVISORY_TRACKER_CREATE }}
          ADVISORY_TRACKER_NOTIFY: ${{ vars.ADVISORY_TRACKER_NOTIFY }}
        run: |
          set -euo pipefail
          dry_run=()
          if [ "${{ steps.mode.outputs.mode }}" = "summary-dry-run" ]; then
              dry_run+=(--dry-run)
          fi
          python3 .github/scripts/advisory_tracker.py summary "${dry_run[@]}" --format markdown --output advisory-tracker-summary.md

      - name: Dry-run sync
        if: steps.mode.outputs.mode == 'dry-run'
        env:
          SNAPD_ADVISORY_GITHUB_TOKEN: ${{ secrets.SNAPD_ADVISORY_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_BUG_LINK_FIELD: ${{ vars.JIRA_BUG_LINK_FIELD }}
          MATTERMOST_NEW_ADVISORY_WEBHOOK_URL: ${{ secrets.MATTERMOST_NEW_ADVISORY_WEBHOOK_URL }}
          ADVISORY_TRACKER_CREATE: ${{ vars.ADVISORY_TRACKER_CREATE }}
          ADVISORY_TRACKER_NOTIFY: ${{ vars.ADVISORY_TRACKER_NOTIFY }}
        run: |
          set -euo pipefail
          python3 .github/scripts/advisory_tracker.py sync --dry-run

      - name: Sync advisories
        if: steps.mode.outputs.mode == 'apply'
        env:
          SNAPD_ADVISORY_GITHUB_TOKEN: ${{ secrets.SNAPD_ADVISORY_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_BUG_LINK_FIELD: ${{ vars.JIRA_BUG_LINK_FIELD }}
          MATTERMOST_NEW_ADVISORY_WEBHOOK_URL: ${{ secrets.MATTERMOST_NEW_ADVISORY_WEBHOOK_URL }}
          ADVISORY_TRACKER_CREATE: ${{ vars.ADVISORY_TRACKER_CREATE }}
          ADVISORY_TRACKER_NOTIFY: ${{ vars.ADVISORY_TRACKER_NOTIFY }}
        run: |
          set -euo pipefail
          python3 .github/scripts/advisory_tracker.py sync

      - name: Upload summary
        if: steps.mode.outputs.mode == 'summary' || steps.mode.outputs.mode == 'summary-dry-run'
        uses: actions/upload-artifact@v7
        with:
          name: advisory-tracker-summary
          path: advisory-tracker-summary.md
