name: security-scan
on:
  pull_request:
    branches: [ "master", "fips", "release/**", "core-snap-security-release/**", "security-release/**", "hotfix/**" ]
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: canonical/reposcan@55f9f01048e884f47dc34b658d2bf7de76fb03e7 # main
        with:
          fail-on: none
          pr-comment: true
          sbom: true