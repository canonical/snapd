name: security-scan
run-name: >-
  ${{ github.event_name == 'schedule' && 'security-scan (weekly)'
   || github.event_name == 'workflow_dispatch' && format('security-scan (manual, {0})', github.ref_name)
   || github.event_name == 'push' && format('security-scan (push to {0})', github.ref_name)
   || format('security-scan (PR #{0})', github.event.pull_request.number) }}
on:
  pull_request:
    branches: ["master", "fips", "release/**", "core-snap-security-release/**", "security-release/**", "hotfix/**"]
  push:
    branches: ["master", "release/**"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    if: github.repository == 'canonical/snapd'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: canonical/reposcan@55f9f01048e884f47dc34b658d2bf7de76fb03e7 # main
        with:
          fail-on: none
          sbom: false