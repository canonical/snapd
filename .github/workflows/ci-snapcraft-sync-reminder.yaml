name: Snapcraft synchronization reminder

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: snapcraft-sync-reminder-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      # do not check out or run PR code with this write-enabled token.
      - name: Comment on Snapcraft changes
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const path = 'build-aux/snap/snapcraft.yaml';
            if (!files.some(file => file.filename === path || file.previous_filename === path)) {
              return;
            }

            const marker = '<!-- snapcraft-sync-reminder -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            if (comments.some(comment =>
              comment.user.type === 'Bot' &&
              comment.user.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            )) {
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                marker,
                'This PR changes `build-aux/snap/snapcraft.yaml`. Please check whether the same changes are needed in `build-aux/snap/snapcraft-fips.yaml`.',
              ].join('\n'),
            });
