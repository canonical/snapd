name: Nightly test snap policy

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check-test-snaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate current inventory
        run: |
          mkdir current
          python3 tests/utils/generate-test-snaps.py \
            --json \
            --exclude-used-by \
            --output current/test-snaps.json

      - name: Upload current inventory
        uses: actions/upload-artifact@v7
        with:
          name: test-snap-inventory
          path: current/test-snaps.json
          retention-days: 7

      - name: Download previous inventory
        id: previous
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run="$({ gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-test-snaps.yaml/runs?branch=${DEFAULT_BRANCH}&status=completed&per_page=1" \
            --jq '.workflow_runs[0].id'; } || true)"
          if [ -n "$previous_run" ] && \
             gh run download "$previous_run" --name test-snap-inventory --dir previous; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No previous inventory is available; this run establishes the baseline."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check newly discovered snaps
        if: steps.previous.outputs.available == 'true'
        shell: python
        run: |
          import json
          from pathlib import Path

          canonical_publishers = {"canonical", "test-snaps-canonical"}
          store_classification = "Defined in tests/lib/snaps/store"
          external_classification = "Not defined under tests"

          current = json.loads(Path("current/test-snaps.json").read_text())["snaps"]
          previous = json.loads(Path("previous/test-snaps.json").read_text())["snaps"]
          previous_names = {snap["name"] for snap in previous}
          new_snaps = [snap for snap in current if snap["name"] not in previous_names]

          errors = []
          for snap in new_snaps:
              name = snap["name"]
              owner = snap.get("owner", {})
              publisher = owner.get("username", owner.get("status", "unknown"))
              belongs_to_canonical = (
                  owner.get("status") == "found"
                  and publisher.lower() in canonical_publishers
              )

              if snap["classification"] == store_classification and not belongs_to_canonical:
                  errors.append(f"{name}: store fixture is published by {publisher!r}")

              if name.startswith("test-snapd-") and snap["classification"] == external_classification:
                  errors.append(f"{name}: has no definition under tests/lib/snaps/store")
                  if not belongs_to_canonical:
                      errors.append(f"{name}: is published by {publisher!r}")

          if errors:
              raise SystemExit("\n".join(f"ERROR: {error}" for error in errors))

          print("No new test snaps violate Store fixture or ownership policy.")