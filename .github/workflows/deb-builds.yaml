name: Build deb package

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'A json list of tags to indicate which runner to use'
        required: true
        type: string
      os:
        description: 'The OS to build the deb package for'
        required: true
        type: string
      os-version:
        description: 'The OS version to build the deb package for'
        required: true
        type: string
      system:
        description: 'The system name as known by spread'
        required: true
        type: string

jobs:
  build-deb:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download vendor
      uses: actions/download-artifact@v8
      with:
        name: vendor-pkgs
        path: /tmp/pkg

    - name: Extract vendor
      run: |
        mkdir /tmp/vendor-dir
        tar -xf /tmp/pkg/snapd*.vendor.tar.xz -C /tmp/vendor-dir
        mv /tmp/vendor-dir/snapd-*/vendor .
        mv /tmp/vendor-dir/snapd-*/c-vendor/* c-vendor/

    - name: Setup debian dir
      run: |
        # top level debian directory must not exist
        test ! -d debian
        target_system="${{ inputs.os }}-${{ inputs.os-version }}"
        case "$target_system" in
            debian-sid)
                ln -sfn packaging/debian-sid debian
                ;;
            ubuntu-*)
                version="${target_system#ubuntu-}"
                if dpkg --compare-versions "$version" ge 26.04; then
                    ln -sfn packaging/ubuntu-26.04 debian
                else
                    ln -sfn packaging/ubuntu-16.04 debian
                fi
                ;;
            *)
                echo "unsupported deb packaging for $target_system"
                exit 1
                ;;
        esac

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        load: true
        file: tests/lib/packaging/debian.dockerfile
        build-args: |
          SYSTEM=${{ inputs.os }}
          TAG=${{ inputs.os-version }}
        tags: deb-base:latest

    - name: Build deb
      run: |
        chmod a+w ../
        chmod -R a+w .
        mkdir -p /tmp/builds
        chmod -R a+w /tmp/builds
        docker run --cap-add SYS_ADMIN --rm \
          --mount type=bind,src=$(dirname $(pwd)),dst=/home/test/snapd-parent \
          --mount type=bind,src=/tmp/builds,dst=/tmp/builds \
          deb-base:latest \
          bash -c "
            chown -R test:test /home/test/snapd-parent/snapd* && \
            cd /home/test/snapd-parent/snapd* && \
            tests/lib/packaging/build-deb.sh --user test --pkg-version "$(cat /tmp/pkg/version)" && \
            cp /home/test/snapd-parent/*.deb /tmp/builds
          "

    - name: Collect build inventory
      if: ${{ inputs.os == 'ubuntu' }}
      run: |
        mkdir -p /tmp/build-inventory

        buildinfo=(../snapd_*.buildinfo)
        if [ "${#buildinfo[@]}" -ne 1 ] || [ ! -f "${buildinfo[0]}" ]; then
          echo "expected exactly one snapd .buildinfo file" >&2
          exit 1
        fi
        grep -q '^Installed-Build-Depends:' "${buildinfo[0]}"
        cp "${buildinfo[0]}" /tmp/build-inventory/

        test -s vendor/modules.txt
        cp vendor/modules.txt /tmp/build-inventory/vendor-modules.txt

        squashfuse_version=$(sed -n 's/^AC_INIT(\[squashfuse\], \[\([^]]*\)\].*/\1/p' c-vendor/squashfuse/configure.ac)
        squashfuse_commit=$(sed -n 's/^SQUASHFUSE_REF=//p' c-vendor/vendor.sh)
        test -n "$squashfuse_version"
        test -n "$squashfuse_commit"
        printf 'squashfuse %s %s\n' "$squashfuse_version" "$squashfuse_commit" \
          > /tmp/build-inventory/vendored-c-dependencies.txt

    - name: upload packages
      uses: actions/upload-artifact@v7
      with:
        name: package-${{ inputs.system }}
        path: /tmp/builds/

    - name: Upload build inventory
      if: ${{ inputs.os == 'ubuntu' }}
      uses: actions/upload-artifact@v7
      with:
        name: package-${{ inputs.system }}-inventory
        path: /tmp/build-inventory/
