name: sync master into fips

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-master-to-fips
  cancel-in-progress: false

jobs:
  open-sync-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: prepare synchronization PR
        shell: bash
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          fips_sha="$(git rev-parse origin/fips)"

          if git merge-base --is-ancestor origin/master "$fips_sha"; then
            exit 0
          fi

          git switch --detach "$fips_sha"
          if ! git merge --no-ff --no-commit origin/master; then
            git rev-parse --verify MERGE_HEAD >/dev/null
          fi
          git show origin/master:build-aux/snap/snapcraft-fips.yaml > build-aux/snap/snapcraft.yaml
          git add build-aux/snap/snapcraft.yaml

          git commit -m "Merge master into fips, using snapcraft-fips.yaml"

          git push --force-with-lease origin HEAD:refs/heads/sync-master-to-fips

          existing_pr="$(gh pr list --base fips --head sync-master-to-fips \
            --limit 1 --json url --jq '.[0].url // empty')"
          if [[ -z "$existing_pr" ]]; then
            gh pr create --base fips --head sync-master-to-fips \
              --title "Synchronize fips with master" \
              --body 'Synchronize fips with master, using snapcraft-fips.yaml from master as snapcraft.yaml. Merge using "Create a merge commit".'
          fi
