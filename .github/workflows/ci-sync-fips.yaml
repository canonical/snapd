name: sync test-fips-master into test-fips

on:
  push:
    branches: ["test-fips-master"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: test-fips-sync
  cancel-in-progress: false

jobs:
  open-sync-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: prepare synchronization PR
        shell: bash
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          fips_sha="$(git rev-parse origin/test-fips)"

          if git merge-base --is-ancestor origin/test-fips-master "$fips_sha"; then
            exit 0
          fi

          git switch --detach "$fips_sha"
          if ! git merge --no-ff --no-commit origin/test-fips-master; then
            git rev-parse --verify MERGE_HEAD >/dev/null
          fi
          git show origin/test-fips-master:build-aux/snap/snapcraft-fips.yaml > build-aux/snap/snapcraft.yaml
          git add build-aux/snap/snapcraft.yaml

          git commit -m "Merge test-fips-master into test-fips, using snapcraft-fips.yaml"

          git push --force-with-lease origin HEAD:refs/heads/test-fips-sync

          existing_pr="$(gh pr list --base test-fips --head test-fips-sync \
            --limit 1 --json url --jq '.[0].url // empty')"
          if [[ -z "$existing_pr" ]]; then
            gh pr create --base test-fips --head test-fips-sync \
              --title "Synchronize test-fips with test-fips-master" \
              --body 'Synchronize test-fips with test-fips-master, using snapcraft-fips.yaml from test-fips-master as snapcraft.yaml. Merge using "Create a merge commit".'
          fi
