name: 'Fuzz go tests'
description: 'Fuzz go tests'
inputs:
  fuzzing-search-dirs:
    description: 'Space-separated snapd sub directory paths where to look for fuzzing tests'
    required: true
  fuzz-only-if-package-has-changed-files:
    description: 'Only run fuzz tests if some file in the package has changed'
    required: false
    default: 'true'
  
runs:
  using: "composite"
  steps:
    - name: Get changed files
      if: inputs.fuzz-only-if-package-has-changed-files == 'true'
      id: changed-files
      uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47.0.0
    
    - name: Select fuzzing directories
      shell: bash
      env:
        SEARCH_DIRS: ${{ inputs.fuzzing-search-dirs }}
        ONLY_CHANGED: ${{ inputs.fuzz-only-if-package-has-changed-files }}
        CHANGED_FILES: ${{ steps.changed-files.outputs.all_modified_files }}
      run: |
        read -r -a directories <<< "$SEARCH_DIRS"
        if [ "${#directories[@]}" -eq 0 ]; then
          echo "::error::Specify at least one fuzzing directory"
          exit 1
        fi
        for directory in "${directories[@]}"; do
          if [ ! -d "$directory" ]; then
            echo "::error::Fuzzing directory does not exist: $directory"
            exit 1
          fi
        done

        if [[ "$ONLY_CHANGED" == "false" ]]; then
          echo "FUZZ=true" >> "$GITHUB_ENV"
          echo "FUZZ_DIRS=$SEARCH_DIRS" >> "$GITHUB_ENV"
          exit 0
        fi

        read -r -a changed_files <<< "$CHANGED_FILES"
        selected=()

        for directory in "${directories[@]}"; do
          directory="${directory#./}"
          directory="${directory%/}"

          for file in "${changed_files[@]}"; do
            file="${file#./}"
            if [[ "$file" == "$directory/"* ]]; then
              selected+=("$directory")
              break
            fi
          done
        done

        if [ "${#selected[@]}" -gt 0 ]; then
          echo "FUZZ=true" >> "$GITHUB_ENV"
          echo "FUZZ_DIRS=${selected[*]}" >> "$GITHUB_ENV"
        else
          echo "FUZZ=false" >> "$GITHUB_ENV"
          echo "FUZZ_DIRS=" >> "$GITHUB_ENV"
        fi
    
    - name: Install go
      if: env.FUZZ == 'true'
      shell: bash
      run: sudo snap install go --classic --channel=latest/stable
    
    - name: Fuzz tests
      if: env.FUZZ == 'true'
      shell: bash
      run: |
        read -r -a directories <<< "$FUZZ_DIRS"
        files=()
        for test in $(find "${directories[@]}" -name '*_test.go'); do
          if grep -q 'func.* Fuzz' "$test"; then
            files+=("$test")
          fi
        done
        for file in ${files[@]}; do
          echo "Fuzzing tests in $file"
          for func in $(grep -oP 'func.* \KFuzz.*(?=\()' "$file"); do
            (
              cd $(dirname "$file")
              echo "Fuzzing test $func"
              go test -fuzz "^$func\$" -fuzztime 3m || touch "${{ github.workspace }}/fuzzingfailed"
            )
          done
        done
    
    - name: Show failures
      shell: bash
      run: |
        find . -wholename '**/testdata/fuzz/*' -type f -exec echo {} \; -exec cat {} \;
        if [ -f "${{ github.workspace }}/fuzzingfailed" ]; then
          exit 1
        fi
