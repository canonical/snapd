type: object
required:
  - message
  - kind
  - value
properties:
  message:
    type: string
    description: A human-readable message identifying the keyslots that were not found.
  kind:
    type: string
    enum:
      - keyslots-not-found
  value:
    type: array
    description: References to the keyslots that were not found.
    items:
      allOf:
        - $ref: '../schemas/SystemVolumeKeyslotTarget.yaml'
        - type: object
          required:
            - container-role
