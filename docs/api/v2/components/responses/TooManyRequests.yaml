description: Too Many Requests. The request was throttled.
content:
  application/json:
    schema:
      type: object
      properties:
        status-code:
          type: integer
          enum:
            - 429
        status:
          type: string
          enum:
            - Too Many Requests
        type:
          type: string
          enum:
            - error
        result:
          oneOf:
            - $ref: '../errors/FDEChangeAuthThrottledError.yaml'
