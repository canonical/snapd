type: object
title: SystemVolumeActionChangePin
description: |-
  Change the PIN for existing keyslots. Root or
  Polkit authorization is not required. Requests through
  /run/snapd-snap.socket require a connected snap-fde-control plug.
required:
  - action
  - old-pin
  - new-pin
properties:
  action:
    type: string
    enum:
      - change-pin
  old-pin:
    allOf:
      - $ref: 'PIN.yaml'
    description: The current PIN.
  new-pin:
    allOf:
      - $ref: 'PIN.yaml'
    description: The replacement PIN.
  keyslots:
    type: array
    description: |-
      Target keyslots to update. Each target must exist and have
      auth-mode `pin`. If omitted, targets the following keyslots
      used during installation:
      - container-role `system-data`, name `default`;
      - container-role `system-data`, name `default-fallback`; and
      - container-role `system-save`, name `default-fallback`.
      Duplicate targets are rejected. Use GET /v2/system-volumes
      to find the target keyslot's container role and name.
    items:
      $ref: 'SystemVolumePlatformKeyslotTarget.yaml'
