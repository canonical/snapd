type: object
title: SystemActionCheckPassphraseQuality
description: >-
  Payload to check the quality of a given passphrase.
  The target system must support passphrase authentication, indicated
  by the 'passphrase-auth' entry in `storage-encryption.features`
  returned by `GET /v2/systems/{label}`. Otherwise, snapd returns a
  400 Bad Request error with result kind `unsupported`.
required:
  - action
  - passphrase
properties:
  action:
    type: string
    enum:
      - check-passphrase-quality
  passphrase:
    type: string
    format: password
    description: The passphrase to validate.
