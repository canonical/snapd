type: object
title: SystemVolumeActionAddRecoveryKey
description: |-
  Add recovery-key keyslots using a generated
  key-id. Requires root access or authorization through the
  io.snapcraft.snapd.manage-fde Polkit action. Requests through
  /run/snapd-snap.socket also require a connected
  snap-fde-control plug.
required:
  - action
  - key-id
  - keyslots
properties:
  action:
    type: string
    enum:
      - add-recovery-key
  key-id:
    type: string
    minLength: 1
    description: The opaque ID returned by generate-recovery-key.
  keyslots:
    type: array
    minItems: 1
    description: |-
      Target keyslots to create. Names must not start with the
      reserved prefixes "snap" or "default", and target keyslots
      must not already exist. Duplicate targets are rejected. Use
      replace-recovery-key for an existing keyslot.
    items:
      allOf:
        - $ref: 'SystemVolumeKeyslotTarget.yaml'
        - type: object
          properties:
            name:
              type: string
              pattern: '^(?!snap|default).+$'
