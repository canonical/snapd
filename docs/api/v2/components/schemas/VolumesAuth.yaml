type: object
title: VolumesAuth
required:
  - mode
description: >-
  Options for the volumes authentication mechanism (passphrase or PIN).
  If omitted, no authentication mechanism is used.
  If `storage-encryption.requirements` in SystemDetails conta'volumes-auth',
  this field is required.
properties:
  mode:
    type: string
    enum:
      - passphrase
      - pin
    description: >-
      The authentication mode to use for the volumes. The selected mmust be
      supported by the system and returned in `storage-encryptfeatures` in
      SystemDetails ('passphrase-auth' for passphrase, 'pin-auth' PIN).
oneOf:
  - type: object
    additionalProperties: false
    required:
      - mode
      - passphrase
    properties:
      mode:
        type: string
        enum:
          - passphrase
      passphrase:
        type: string
        format: password
      kdf-type:
        type: string
        enum:
          - argon2i
          - argon2id
          - pbkdf2
        description: >-
          The key derivation function to use for passphrase
          authentication. If omitted, snapd defaults to 'argon2id'.
  - type: object
    additionalProperties: false
    required:
      - mode
      - pin
    properties:
      mode:
        type: string
        enum:
          - pin
      pin:
        type: string
        format: password
        pattern: '^[0-9]+$'
        maxLength: 255