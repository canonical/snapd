type: object
title: SystemActionCheckPinQuality
description: >-
  Payload to check the quality of a given PIN.
  The target system must support PIN authentication, indicated
  by the 'pin-auth' entry in `storage-encryption.features`
  returned by `GET /v2/systems/{label}`. Otherwise, snapd returns a
  400 Bad Request error with result kind `unsupported`.
required:
  - action
  - pin
properties:
  action:
    type: string
    enum:
      - check-pin-quality
  pin:
    type: string
    format: password
    pattern: '^[0-9]+$'
    description: The PIN to validate.
