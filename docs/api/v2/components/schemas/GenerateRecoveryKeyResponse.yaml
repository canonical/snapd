type: object
title: GenerateRecoveryKeyResponse
description: >-
  Response body containing the generated recovery key, for the
  `generate-recovery-key` step of the `install` action on
  `POST /v2/systems/{label}` and for the `generate-recovery-key` action on
  `POST /v2/systems`.
required:
  - recovery-key
properties:
  recovery-key:
    type: string
    description:
      A 16-byte number represented as 8 5-digit zero-extended base-10 numbers (each with range of
      00000-65535) which may be separated by an optional '-'.
    example: "61665-00531-54469-09783-47273-19035-40077-28287"
