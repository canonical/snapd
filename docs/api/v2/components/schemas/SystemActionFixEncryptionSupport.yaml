type: object
title: SystemActionFixEncryptionSupport
description: >-
  Payload to apply a corrective action to fix storage encryption support.
  This action can be performed either pre-install, on `POST
  /v2/systems/{label}`, or post-install, on `POST /v2/systems`.

  Action `fix-encryption-support` requires an initial GET request that
  creates an in-memory check context: `GET /v2/systems/{label}` for
  pre-install, or `GET /v2/systems?running=true` for post-install. Each iteration of the `fix-encryption-support` action applies the requested fix and runs a subsequent pre- or post-install check, using that context, so multiple actions can be performed in sequence. Another GET request to the same system replaces this context and resets the action sequence. The context is also lost if snapd restarts or the system reboots.
required:
  - action
  - fix-action
properties:
  action:
    type: string
    enum:
      - fix-encryption-support
  fix-action:
    type: string
    description: >-
      The specific fix to apply. An empty string maps to `ActionNone` in the secboot
      library. Otherwise, it must be an action reported by the most recent pre-install
      check. Actions should be attempted in the order in which they appear in the `actions`
      array for the relevant item in `SystemDetails.storage-encryption.availability-check-errors`.
  args:
    type: object
    minProperties: 1
    additionalProperties: true
    description: A map of key-value arguments for the fix action.
