type: object
title: SystemDetails
description: Detailed information about a specific recovery system.
properties:
  current:
    type: boolean
    description: Whether this is the currently running system.
  label:
    type: string
    description: The unique label identifying the recovery system.
  brand:
    type: object
    title: StoreAccount # TODO: Adding 'title' fields to inline defined objects provide greater clarity to the user.
    properties:
      id:
        type: string
      username:
        type: string
      display-name:
        type: string
      validation:
        type: string
  model:
    type: object
    description: A map of the model assertion's headers.
    additionalProperties: true
  actions:
    type: array
    description: A list of actions that can be performed on this system.
    items:
      type: object
      title: SystemActionInfo
      properties:
        title:
          type: string
        mode:
          type: string
  available-optional:
    type: object
    properties:
      snaps:
        type: array
        items:
          type: string
        description: A list of optional snaps available for installation.
      components:
        type: object
        description: >-
          A map of snap names to the optional components available for
          installation.
        additionalProperties:
          type: array
          items:
            type: string
  volumes:
    type: object
    description: >-
      A map of the storage volumes defined by the system's gadget snap, keyed
      by volume name.
    additionalProperties:
      $ref: 'GadgetVolume.yaml'
  storage-encryption:
    type: object
    title: StorageEncryptionInfo
    description: Information about the system's storage encryption capabilities.
    properties:
      support:
        type: string
        enum:
          - disabled
          - available
          - defective
          - unavailable
        description: The current support status for storage encryption.
      storage-safety:
        type: string
        description: The required storage safety level (e.g., 'encrypted').
      encryption-type:
        type: string
        description: The type of encryption (e.g., 'luks2').
      unavailable-reason:
        type: string
        description: >-
          The reason why storage encryption is unavailable or defective. When
          a single availability check error is detected, unavailable-reason reports
          the error message; when multiple errors are detected, it reports the number of
          errors (e.g. 'availability check identified 2 errors'). Must be populated if
          availability-check-errors is non-empty.
      availability-check-errors:
        type: array
        description: A list of errors detected during the preinstall check, as determined by the secboot library.
        items:
          type: object
          title: PreinstallErrorDetails
          required:
            - kind
            - message
          properties:
            kind:
              type: string
              description: The kind of the error as classified by the secboot library.
            message:
              type: string
              description: A human readable description of the error.
            args:
              type: object
              additionalProperties: true
              description: >-
                Additional information relating to the error, as constructed by the secboot library during classification.
            actions:
              type: array
              items:
                type: string
              description: >-
                The available actions for the error kind, as mapped by the secboot library.
                Actions are listed in the order they should be attempted.
      features:
        type: array
        items:
          type: string
          enum:
            - passphrase-auth
            - pin-auth
        description: A list of supported encryption features.
      requirements:
        type: array
        items:
          type: string
          enum:
            - volumes-auth
        description: A list of requirements that must be met for storage encryption to be supported.
