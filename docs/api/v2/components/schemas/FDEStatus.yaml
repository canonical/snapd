type: object
title: FDEStatus
description: >-
  Status information describing whether the system has a working full-disk
  encryption (FDE) setup. If the FDE is set up and not working, includes details to better understand the situation.
  When field 'status' is 'recovery' or 'degraded', field 'auto-repair-result'
  describes the result of the auto-repair attempt.
required:
  - status
  - auto-repair-result
  - preinstall
properties:
  status:
    oneOf:
      - type: string
        const: active
        description: >-
          The system is FDE enabled and operating normally (none of
          the other states apply).
      - type: string
        const: inactive
        description: >-
          FDE is not currently active, because TPM-backed FDE was
          not selected at install time.
      - type: string
        const: recovery
        description: >-
          A recovery key was provided to unlock one or more storage
          containers, but the system has not yet been restarted.
      - type: string
        const: degraded
        description: >-
          The system is unlocked, but another problem was detected.
      - type: string
        const: indeterminate
        description: >-
          There was an error while detecting the current status. This can
          also happen in case of a major failure starting snapd.
  auto-repair-result:
    description: >-
      The result of the automatic post-recovery repair. Always present in
      this version of the API. Interpretation applies when field 'status' is
      'recovery' or 'degraded'.
    oneOf:
      - type: string
        const: not-initialized
        description: >-
          Reported early on snapd boot, until it has checked whether or not
          to run the repair.
      - type: string
        const: not-attempted
        description: >-
          Snapd determined that another type of fix is needed, and it will
          be provided in 'recommendations'.
      - type: string
        const: failed-platform-init
        description: >-
          An auto-repair was attempted but did not work. 'recommendations'
          should be followed.
      - type: string
        const: failed-keyslots
        description: >-
          An auto-repair was attempted but did not work. 'recommendations'
          should be followed.
      - type: string
        const: failed-encryption-support
        description: >-
          An auto-repair was attempted but did not work. 'recommendations'
          should be followed.
      - type: string
        const: success
        description: >-
          Nothing else needs to be done. If the user booted with a recovery
          key, the following reboot will not require it (the client might
          want to recommend a reboot to test it).
  recommendations:
    type: array
    description: >-
      A list of identifiers for remedial actions recommended to the system
      administrator to manually repair the FDE setup.
    items:
      oneOf:
        - type: string
          const: permit-manual
          description: >-
            In combination with 'require-reprovision', signals that an
            administrator could potentially fix the system by re-enrolling
            keys without reprovisioning.
        - type: string
          const: require-reprovision
          description: >-
            A reprovision is required. However, 'permit-manual' in
            combination with 'require-reprovision' signals that an
            administrator could potentially fix the system by re-enrolling
            keys without reprovisioning.
        - type: string
          const: require-platform-reset
          description: >-
            The TPM needs to be cleared. To clear the TPM and keep the data
            on the encrypted disk requires knowledge of the recovery key. If
            'status' is not 'recovery' (which indicates the user has used a
            recovery key to boot), then the client has to verify the user
            knows the recovery key.
  preinstall:
    type: object
    description: Information related to decisions made at install time.
    required:
      - accepted-errors
      - requirements
    properties:
      accepted-errors:
        type: object
        description: >-
          A map of error-kind to arguments, for each preinstall check error
          that was accepted via a 'proceed' action at install time. Arguments
          are currently unused but reserved for future use.
        additionalProperties:
          type: object
          nullable: true
          additionalProperties: true
      requirements:
        type: array
        items:
          type: string
          enum:
            - volumes-auth
        description: >-
          A list of requirements enforced at install time. 'volumes-auth'
          indicates that volumes authentication using a PIN or passphrase is
          required.
