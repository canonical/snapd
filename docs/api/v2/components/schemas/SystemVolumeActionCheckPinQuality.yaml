type: object
title: SystemVolumeActionCheckPinQuality
description: |-
  Assess PIN quality using the same request and
  response structure as the pre-install quality check. This
  runtime check does not return the `unsupported` error kind.
  Root or Polkit authorization is not required. Requests through
  /run/snapd-snap.socket require a connected snap-fde-control plug.
required:
  - action
  - pin
properties:
  action:
    type: string
    enum:
      - check-pin-quality
  pin:
    allOf:
      - $ref: 'PIN.yaml'
    description: The PIN to validate.
