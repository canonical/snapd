type: object
title: SystemActionReprovision
description: >-
  Payload to reprovision the running system. Before initiating this action,
  the client should use `GET /v2/systems?running=true` to check
  `storage-encryption.support`, resolving any `availability-check-errors`
  with `fix-encryption-support` actions until `support` is `available`,
  then generate and save a new recovery key with the
  'generate-recovery-key' action. Restarting snapd between these steps loses the required state and will cause this action to fail. In that case, the sequence must be restarted from `GET /v2/systems?running=true`.
required:
  - action
properties:
  action:
    type: string
    enum:
      - reprovision
