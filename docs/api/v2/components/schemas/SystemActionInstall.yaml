type: object
title: SystemActionInstall
description: Payload to perform a step in the system installation process.
required:
  - action
  - step
properties:
  action:
    type: string
    enum:
      - install
  step:
    type: string
    description: The specific step of the installation process to execute.
    enum:
      - setup-storage-encryption
      - generate-recovery-key
      - finish
      - preseed
oneOf:
  - type: object
    description: Sets up the system's storage encryption.
    required:
      - step
    properties:
      step:
        type: string
        enum:
          - setup-storage-encryption
      on-volumes:
        type: object
        description: >-
          A map of the volumes to operate on, keyed by volume name.
        additionalProperties:
          $ref: 'GadgetVolume.yaml'
      volumes-auth:
        $ref: './VolumesAuth.yaml'
      keyboard-config:
        type: object
        description:
          Keyboard configuration selected at install time, used to configure the keymap on first boot (e.g.
          plymouth passphrase/PIN prompt). This field is required when 'volumes-auth' is set. Values must
          form a valid XKB configuration.
        properties:
          layout:
            type: string
            description: The keyboard layout to use (for example, 'us', 'uk', or 'eg').
            example: 'us'
          model:
            type: string
            description: The keyboard model to use.
            example: 'pc105'
          variant:
            type: string
            description: The keyboard variant to use.
            example: 'dvorak'
          options:
            type: array
            items:
              type: string
            description: A list of additional keyboard options to use.
            example: ['ctrl:nocaps']
  - type: object
    description: >-
      Generates a recovery key for the system. Complete the `setup-storage-encryption` step before this step.
    required:
      - step
    properties:
      step:
        type: string
        enum:
          - generate-recovery-key
  - type: object
    description: >-
      Finishes the installation by writing missing volume content, setting up the bootloader, and
      installing the kernel. When complete, the installed system is ready to reboot.
    required:
      - step
    properties:
      step:
        type: string
        enum:
          - finish
      on-volumes:
        type: object
        description: >-
          A map of the volumes to operate on, keyed by volume name.
        additionalProperties:
          $ref: 'GadgetVolume.yaml'
      optional-install:
        type: object
        properties:
          all:
            type: boolean
            description:
              If true, install all optional snaps and components. Cannot be used if 'snaps' or 'components'
              are specified.
          snaps:
            type: array
            items:
              type: string
            description: A list of specific optional snaps to install.
          components:
            type: array
            items:
              type: string
            description: A list of specific optional components to install.
  - type: object
    description: >-
      Preseeds the installed system. Call this step after the `finish` step completes and before rebooting.
    required:
      - step
      - target-root
    properties:
      step:
        type: string
        enum:
          - preseed
      target-root:
        type: string
        description: The path to the rootfs of the mounted target system for the `preseed` step.
