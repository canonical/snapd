allOf:
  - $ref: 'SystemVolumeKeyslotTarget.yaml'
  - type: object
    properties:
      name:
        type: string
        description: |-
          Names must not start with the reserved prefixes "snap" or
          "default", except "default-recovery".
        pattern: '^(?:default-recovery|(?!snap|default).+)$'
