get:
  tags:
    - AuthenticatedAccess
    - Systems
    - Synchronous
  summary: Get the list of recovery systems or the running system's details
  description: |-
    Retrieves a list of all available recovery systems on the device. If the
    'running' query parameter is provided and set to 'true', instead returns
    the details of the currently running system (equivalent to 'GET
    /v2/systems/{label}' for the running system's label).
  operationId: getSystems
  security:
    - PeerAuth: []
  parameters:
    - name: running
      in: query
      description: |-
        If set to 'true', returns the details of the currently
        running system instead of the list of all recovery systems. When set to 'true', the request additionally requires the
        'snap-fde-control' interface or polkit authorization.
      schema:
        type: boolean
  responses:
    200:
      description: |-
        A list of recovery systems, or, if 'running=true' is provided, the
        details of the currently running system.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                properties:
                  systems:
                    type: array
                    items:
                      $ref: '../components/schemas/System.yaml'
              - $ref: '../components/schemas/SystemDetails.yaml'
    500:
      $ref: '../components/responses/InternalError.yaml'

post:
  tags:
    - AuthenticatedAccess
    - Systems
    - Asynchronous # Actions like 'create' and 'install' are async
    - Synchronous
  summary: Perform an action on the current recovery system or create a new one
  description: |-
    Perform an action such as 'reboot', 'install', or 'fix-encryption-support'
    on the current active recovery system, or 'create' a new recovery
    system.
  operationId: performSystemAction
  security:
    - PeerAuth: [] # TODO This was originally designated as root auth, investigate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: '../components/schemas/SystemActionCreate.yaml'
            - $ref: '../components/schemas/SystemActionInstall.yaml'
            - $ref: '../components/schemas/SystemActionReboot.yaml'
            - $ref: '../components/schemas/SystemActionFixEncryptionSupport.yaml'
      # TODO document multipart/form-data
  responses:
    200:
      description: The action was handled synchronously.
      content:
        application/json:
          schema:
            type: object
            properties:
              status-code:
                type: integer
                enum:
                  - 200
              status:
                type: string
                enum:
                  - OK
              type:
                type: string
                enum:
                  - sync
              result:
                description: |-
                  The result of the synchronous operation, specific to each action:
                    - `null` for action `reboot`; and
                    - the updated system details for action `fix-encryption-support`.
                anyOf:
                  - $ref: '../components/schemas/SystemDetails.yaml'
                  - type: object
                    nullable: true
                    enum:
                      - null
    202:
      description: The asynchronous action (e.g., create, install) was accepted and is in progress.
      $ref: '../components/responses/Accepted.yaml'
    400:
      $ref: '../components/responses/BadRequest.yaml'
    404:
      $ref: '../components/responses/NotFound.yaml'
