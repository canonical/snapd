get:
  tags:
    - InterfaceOpenAccess
    - Synchronous
    - Systems
  summary: Enumerate system volume keyslots
  description: |-
    Enumerate keyslots for a container role, or for all containers grouped by
    container role. The response includes properties of each structure,
    including encryption-related details.
  operationId: getSystemVolumes
  security: []
  parameters:
    - name: container-role
      in: query
      description: Return containers matching any of the specified roles.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      example: [system-data, system-save]
    - name: by-container-role
      in: query
      description: Return all containers grouped by their container roles when true. Must not be true when container-role is supplied; filtered results are already grouped by container role.
      schema:
        type: boolean
      example: true
  responses:
    200:
      description: Containers and their keyslots grouped by container role.
      content:
        application/json:
          schema:
            type: object
            properties:
              status-code:
                type: integer
                enum:
                  - 200
              status:
                type: string
                enum:
                  - OK
              type:
                type: string
                enum:
                  - sync
              result:
                type: object
                properties:
                  by-container-role:
                    type: object
                    description: A map of container roles to gadget structures and their keyslots.
                    additionalProperties:
                      type: object
                      properties:
                        volume-name:
                          type: string
                          description: The name of the volume in the gadget.
                        name:
                          type: string
                          description: The name of the partition in the gadget.
                        encrypted:
                          type: boolean
                          description: Whether the container is encrypted.
                        keyslots:
                          type: object
                          description: A map of keyslot names to keyslot details.
                          additionalProperties:
                            type: object
                            required:
                              - type
                            properties:
                              type:
                                type: string
                                enum:
                                  - recovery
                                  - platform
                              roles:
                                type: array
                                description: Roles of a platform key, only for platform keys.
                                items:
                                  type: string
                              platform-name:
                                type: string
                                description: Platform name, only for platform keys.
                              auth-mode:
                                type: string
                                description: Authentication mode, only for platform keys.
                                enum:
                                  - none
                                  - pin
                                  - passphrase
    400:
      $ref: '../components/responses/BadRequest.yaml'

post:
  tags:
    - Systems
    - Synchronous
    - Asynchronous
  summary: Manage system volume keys and check authentication quality
  description: |-
    Generate, check, add, or replace system volume keys, and check or
    change PINs and passphrases at runtime. The request action determines the required fields and whether the operation is synchronous or asynchronous.
  operationId: performSystemVolumesAction
  security:
    - PeerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: '../components/schemas/SystemVolumeActionGenerateRecoveryKey.yaml'
            - $ref: '../components/schemas/SystemVolumeActionAddRecoveryKey.yaml'
            - $ref: '../components/schemas/SystemVolumeActionReplaceRecoveryKey.yaml'
            - $ref: '../components/schemas/SystemVolumeActionCheckRecoveryKey.yaml'
            - $ref: '../components/schemas/SystemVolumeActionCheckPinQuality.yaml'
            - $ref: '../components/schemas/SystemVolumeActionCheckPassphraseQuality.yaml'
            - $ref: '../components/schemas/SystemVolumeActionChangePin.yaml'
            - $ref: '../components/schemas/SystemVolumeActionChangePassphrase.yaml'
            - $ref: '../components/schemas/SystemVolumeActionReplacePlatformKey.yaml'
          discriminator:
            propertyName: action
            mapping:
              generate-recovery-key: '../components/schemas/SystemVolumeActionGenerateRecoveryKey.yaml'
              add-recovery-key: '../components/schemas/SystemVolumeActionAddRecoveryKey.yaml'
              replace-recovery-key: '../components/schemas/SystemVolumeActionReplaceRecoveryKey.yaml'
              check-recovery-key: '../components/schemas/SystemVolumeActionCheckRecoveryKey.yaml'
              check-pin-quality: '../components/schemas/SystemVolumeActionCheckPinQuality.yaml'
              check-passphrase-quality: '../components/schemas/SystemVolumeActionCheckPassphraseQuality.yaml'
              change-pin: '../components/schemas/SystemVolumeActionChangePin.yaml'
              change-passphrase: '../components/schemas/SystemVolumeActionChangePassphrase.yaml'
              replace-platform-key: '../components/schemas/SystemVolumeActionReplacePlatformKey.yaml'
  responses:
    200:
      description: |-
        The action was handled synchronously.
      content:
        application/json:
          schema:
            type: object
            required:
              - type
              - status-code
              - status
              - result
            properties:
              type:
                type: string
                enum:
                  - sync
              status-code:
                type: integer
                enum:
                  - 200
              status:
                type: string
                enum:
                  - OK
              result:
                anyOf:
                  - type: object
                    description: The generated recovery key and its opaque key ID.
                    required:
                      - recovery-key
                      - key-id
                    properties:
                      recovery-key:
                        type: string
                        description: The recovery key to display to the user.
                      key-id:
                        type: string
                        description: |-
                          The opaque ID to use with add-recovery-key or
                          replace-recovery-key. Can be used once within five minutes.
                  - description: The recovery key is valid for all targeted containers.
                    enum:
                      - null
                  - $ref: '../components/schemas/AuthQualityEntropyMetrics.yaml'
    202:
      $ref: '../components/responses/Accepted.yaml'
    400:
      $ref: '../components/responses/BadRequest.yaml'
    401:
      $ref: '../components/responses/AccessDenied.yaml'
    403:
      $ref: '../components/responses/Forbidden.yaml'
    409:
      $ref: '../components/responses/Conflict.yaml'
    429:
      $ref: '../components/responses/TooManyRequests.yaml'
    500:
      $ref: '../components/responses/InternalError.yaml'
